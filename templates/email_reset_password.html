<!--
  AlphaHunt — Password Reset Email Template
  =========================================
  Paste this HTML into:
    Supabase Dashboard → Authentication → Email Templates → Reset Password

  Supabase variables used:
    {{ .ConfirmationURL }}  — the recovery link the user clicks

  Notes:
    - Uses table-based layout for max email-client compatibility (Gmail, Outlook, Apple Mail).
    - All styles are inline where it matters; <style> block is a progressive enhancement.
    - Logo is loaded from https://alphahunt.in — make sure the asset is publicly reachable.
    - Illustration is inline SVG (a magnifying glass + lock, matching the CarePair reference).
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset your AlphaHunt password</title>
<style>
  body { margin:0; padding:0; background:#4338ca; }
  a { text-decoration:none; }
  @media only screen and (max-width: 600px) {
    .card { width:100% !important; border-radius:0 !important; }
    .card-pad { padding:32px 24px !important; }
  }
</style>
</head>
<body style="margin:0;padding:0;background:linear-gradient(135deg,#4338ca 0%,#6d28d9 50%,#ec4899 100%);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="background:linear-gradient(135deg,#4338ca 0%,#6d28d9 50%,#ec4899 100%);padding:48px 16px;">
  <tr>
    <td align="center">

      <!-- ── Card ────────────────────────────────────────────────────────── -->
      <table role="presentation" class="card" width="480" cellpadding="0" cellspacing="0" border="0"
             style="background:#ffffff;border-radius:18px;box-shadow:0 24px 64px rgba(10,14,26,.25);overflow:hidden;">

        <!-- Logo / wordmark -->
        <tr>
          <td class="card-pad" align="center" style="padding:40px 48px 8px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="vertical-align:middle;padding-right:8px;">
                  <img src="https://alphahunt.in/static/icons/alpha-logo-bare-64.png"
                       alt="" width="28" height="28"
                       style="display:block;width:28px;height:28px;">
                </td>
                <td style="vertical-align:middle;font-size:20px;font-weight:900;letter-spacing:-.02em;color:#0a0a0a;">
                  Alpha<span style="background:linear-gradient(135deg,#4338ca 0%,#8b5cf6 50%,#ec4899 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:#8b5cf6;">Hunt</span>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Illustration tile -->
        <tr>
          <td class="card-pad" align="center" style="padding:24px 48px 0;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                   style="background:#eef2ff;border-radius:14px;">
              <tr>
                <td align="center" style="padding:28px 16px;">
                  <!-- Inline SVG: magnifying glass + padlock -->
                  <svg xmlns="http://www.w3.org/2000/svg" width="120" height="96" viewBox="0 0 120 96" fill="none" aria-hidden="true">
                    <!-- magnifying glass -->
                    <circle cx="42" cy="42" r="26" stroke="#4338ca" stroke-width="3.5" fill="#ffffff"/>
                    <line x1="62" y1="62" x2="80" y2="80" stroke="#4338ca" stroke-width="5" stroke-linecap="round"/>
                    <!-- question marks -->
                    <text x="20" y="22" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#8b5cf6">?</text>
                    <text x="64" y="18" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#ec4899">?</text>
                    <!-- padlock -->
                    <rect x="86" y="44" width="26" height="22" rx="3" fill="#4338ca"/>
                    <path d="M91 44 v-5 a8 8 0 0 1 16 0 v5" stroke="#4338ca" stroke-width="3" fill="none" stroke-linecap="round"/>
                    <circle cx="99" cy="55" r="2.5" fill="#ffffff"/>
                    <rect x="98" y="55" width="2" height="6" fill="#ffffff"/>
                  </svg>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Greeting + body -->
        <tr>
          <td class="card-pad" align="center" style="padding:28px 48px 8px;">
            <p style="margin:0 0 12px;font-size:18px;font-weight:700;color:#0a0a0a;">Hi there,</p>
            <p style="margin:0;font-size:15px;line-height:1.55;color:#475569;">
              Need to reset your password? No problem.<br>
              Just click the button below.
            </p>
          </td>
        </tr>

        <!-- CTA -->
        <tr>
          <td class="card-pad" align="center" style="padding:28px 48px 40px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td align="center"
                    style="background:linear-gradient(135deg,#4338ca 0%,#8b5cf6 50%,#ec4899 100%);border-radius:999px;">
                  <a href="{{ .ConfirmationURL }}"
                     style="display:inline-block;padding:14px 32px;font-size:15px;font-weight:700;color:#ffffff;letter-spacing:.01em;">
                    Reset password →
                  </a>
                </td>
              </tr>
            </table>
            <p style="margin:18px 0 0;font-size:12.5px;line-height:1.5;color:#94a3b8;">
              This link will expire in 1 hour.
            </p>
          </td>
        </tr>

        <!-- Divider -->
        <tr>
          <td style="padding:0 48px;">
            <div style="border-top:1px solid #eef0f3;"></div>
          </td>
        </tr>

        <!-- Footer -->
        <tr>
          <td class="card-pad" style="padding:24px 48px 32px;font-size:12.5px;line-height:1.6;color:#94a3b8;">
            <p style="margin:0 0 12px;">
              If you did not initiate this request, please contact us at
              <a href="mailto:support@alphahunt.in" style="color:#4338ca;font-weight:600;">support@alphahunt.in</a>.
            </p>
            <p style="margin:0;">
              Thanks,<br>
              The AlphaHunt Team
            </p>
          </td>
        </tr>

        <!-- Bottom strip -->
        <tr>
          <td style="background:#f8fafc;padding:14px 48px;font-size:11.5px;color:#94a3b8;">
            &copy; 2026 AlphaHunt
          </td>
        </tr>

      </table>
      <!-- ── /Card ───────────────────────────────────────────────────────── -->

    </td>
  </tr>
</table>
</body>
</html>
