<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thesis Map — TickerMover</title>
<meta name="description" content="Interactive thesis maps from TickerMover — trace how a macro driver propagates down a supply chain, company by company, with the lag built in.">
<link rel="icon" type="image/svg+xml" href="/static/brand/tickermover-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#2970ff;--blue-d:#0040c1;--ink:#0f172a;--muted:#475569;--faint:#94a3b8;
  --line:rgba(15,23,42,.09);--card:#ffffff;--bg:#fcfbf9;
  --pos:#0a7d33;--pos-soft:#e7f6ec;--neg:#dc2626;--neg-soft:#fdeceb;--zero:#cbd5e1;
  --e-hi:#2970ff;--e-mid:#7aa8ff;--e-lo:#cfe0ff;
  /* layer identity = a single-hue blue depth ramp (sequential, not rainbow);
     green stays reserved for tailwind so the diverging impact encoding is unambiguous */
  --l1:#1e40af;--l2:#1e5bd6;--l3:#2970ff;--l4:#4b8bf5;--l5:#6ba3f0;--l6:#8fbaea;
  --serif:'Fraunces',Georgia,serif;--body:'Instrument Sans',system-ui,-apple-system,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--blue)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.top{position:sticky;top:0;z-index:20;background:rgba(252,251,249,.86);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px}
.back{font-size:13px;font-weight:600;color:var(--muted);text-decoration:none}
.back:hover{color:var(--ink)}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;font-weight:600;font-size:18px;letter-spacing:-.022em;color:#0a0a0a}
.brand .mark{width:26px;height:26px;flex:none;background:linear-gradient(135deg,#5DB3F1,#2970FF 50%,#0040c1);-webkit-mask:url('/static/brand/tickermover-mark-mask.svg') center/contain no-repeat;mask:url('/static/brand/tickermover-mark-mask.svg') center/contain no-repeat}
.wrap{max-width:1120px;margin:0 auto;padding:30px 20px 70px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--blue-d);background:linear-gradient(135deg,#eef4ff,#f5f9ff);border:1px solid #cfe0ff;border-radius:999px;padding:6px 13px}
h1.title{font-family:var(--serif);font-weight:600;font-size:clamp(30px,5.4vw,50px);line-height:1.05;letter-spacing:-.018em;margin:16px 0 12px;max-width:26ch}
h1.title em{font-style:italic;color:var(--blue-d)}
.standfirst{font-size:17.5px;line-height:1.5;color:#334155;max-width:72ch;margin:0 0 6px}

/* driver control */
.control{margin:30px 0 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px 18px;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.control-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.control-label{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.readout{font-family:var(--serif);font-size:38px;font-weight:600;color:var(--blue-d);line-height:1}
.readout small{font-size:16px;color:var(--faint);font-weight:600;margin-left:3px}
.presets{display:flex;gap:7px;margin:14px 0 4px;flex-wrap:wrap}
.preset{font-size:12px;font-weight:700;font-family:var(--body);border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:5px 12px;cursor:pointer;transition:all .14s}
.preset:hover{border-color:#cfe0ff;color:var(--blue-d)}
.preset.on{background:#eef4ff;border-color:#cfe0ff;color:var(--blue-d)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;background:linear-gradient(90deg,#fde2e0,#eef2f7 50%,#dbeadf);border-radius:3px;outline:none;margin:16px 0 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--blue);cursor:pointer;border:3px solid #fff;box-shadow:0 2px 6px rgba(9,20,60,.28)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--blue);cursor:pointer;border:3px solid #fff;box-shadow:0 2px 6px rgba(9,20,60,.28)}
.scale{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:9px}

/* movers leaderboard */
.movers{margin:14px 0 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 20px 18px;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.movers-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.movers-h b{font-family:var(--serif);font-weight:600;font-size:18px}
.movers-h span{font-size:12px;color:var(--faint)}
.mv{display:grid;grid-template-columns:96px 1fr 62px;align-items:center;gap:12px;padding:5px 0}
.mv .mv-tk{font-family:var(--mono);font-weight:700;font-size:12.5px}
.mv .mv-tk small{color:var(--faint);font-weight:500;margin-left:5px}
.mv-track{position:relative;height:12px}
.mv-fill{position:absolute;top:0;bottom:0;left:0;border-radius:3px;transition:width .5s cubic-bezier(.32,.72,.31,1),background .3s;min-width:2px}
.mv-fill.pos{background:linear-gradient(90deg,#34d17a,var(--pos))}
.mv-fill.neg{background:linear-gradient(90deg,#f87171,var(--neg))}
.mv-val{font-family:var(--mono);font-weight:700;font-size:12.5px;text-align:right}
.pos-t{color:var(--pos)}.neg-t{color:var(--neg)}.zero-t{color:var(--faint)}

/* follow the money — thesis market size */
.money{margin:14px 0 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 20px 18px;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.money-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.money-h b{font-family:var(--serif);font-weight:600;font-size:18px}
.money-h span{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.money-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.money-stat .mo-v{font-family:var(--serif);font-weight:600;font-size:27px;color:var(--blue-d);line-height:1.05}
.money-stat .mo-k{font-size:11.5px;font-weight:700;color:var(--muted);margin-top:3px}
.money-stat .mo-bar{margin-top:8px;height:6px;background:#eef2f7;border-radius:3px;overflow:hidden}
.money-stat .mo-bar i{display:block;height:100%;background:linear-gradient(90deg,#5DB3F1,var(--blue));border-radius:3px}
.money-note{font-size:11.5px;color:var(--faint);line-height:1.5;margin-top:13px}
/* who's gained — real returns */
.winners{margin:14px 0 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 20px 18px;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.winners-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.winners-h b{font-family:var(--serif);font-weight:600;font-size:18px}
.winners-h span{font-size:12px;color:var(--faint)}

/* chain */
.chain{margin:26px 0 0;position:relative}
.sec-h{font-family:var(--serif);font-weight:600;font-size:20px;margin:0 0 2px}
.sec-sub{font-size:13.5px;color:var(--muted);margin:0 0 8px}
.sec-asof{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);background:var(--pos-soft);border:1px solid #bfe6cb;border-radius:8px;padding:5px 11px;margin:0 0 14px}
.sec-asof b{color:var(--pos);font-weight:700}
.sec-asof .asof-dot{width:7px;height:7px;border-radius:50%;flex:none;background:#0a7d33;box-shadow:0 0 0 3px rgba(10,125,51,.15)}
.layer{display:grid;grid-template-columns:210px 1fr;gap:24px;padding:22px 0;border-bottom:1px solid var(--line);position:relative}
.layer:last-child{border-bottom:none}
.layer-meta{position:relative;padding-left:26px}
.spine{position:absolute;left:6px;top:6px;bottom:-22px;width:2px;background:var(--line)}
.layer:last-child .spine{bottom:6px}
.node{position:absolute;left:0;top:4px;width:14px;height:14px;border-radius:50%;background:#fff;border:2.5px solid var(--lc,#2970ff);z-index:1}
.node::after{content:"";position:absolute;inset:2px;border-radius:50%;background:var(--lc,#2970ff);opacity:0;transform:scale(.3)}
.layer.lit .node::after{animation:ping .9s ease-out}
@keyframes ping{0%{opacity:0;transform:scale(.3)}30%{opacity:1;transform:scale(1)}100%{opacity:.35;transform:scale(1)}}
.layer-idx{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--faint);display:block;margin-bottom:2px}
.layer-name{font-family:var(--serif);font-weight:600;font-size:18px;line-height:1.12;letter-spacing:-.01em;margin:0 0 6px}
.layer-lag{font-size:12px;color:var(--muted);line-height:1.45}
/* money-arrival badge — the hook: when the spend actually reaches this layer */
.layer-when-badge{display:inline-flex;flex-direction:column;gap:1px;margin:2px 0 10px;padding:7px 13px 8px;border-radius:11px;background:#eef4ff;border:1px solid #cfe0ff;line-height:1.14}
.layer-when-badge .lw-k{font-size:8.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--blue-d);opacity:.72}
.layer-when-badge .lw-v{font-family:var(--serif);font-weight:600;font-size:20px;color:var(--blue-d);letter-spacing:-.01em}
.layer-when-badge .lw-h{font-size:11px;font-weight:600;color:var(--muted)}
.layer-when-badge.first{background:var(--pos-soft);border-color:#bfe6cb}
.layer-when-badge.first .lw-k{color:var(--pos)}
.layer-when-badge.first .lw-v{color:var(--pos)}
.layer-sum{margin-top:10px;display:flex;flex-direction:column;gap:5px}
.layer-sum .ls-row{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted)}
.layer-sum .ls-k{font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);min-width:66px}
.layer-sum .ls-mix{display:flex;gap:2px}
.layer-sum .ls-seg{width:16px;height:5px;border-radius:2px}
.layer-sum .ls-seg.hi{background:var(--e-hi)}.layer-sum .ls-seg.mid{background:var(--e-mid)}.layer-sum .ls-seg.lo{background:var(--e-lo)}
.layer-sum .ls-lead{font-family:var(--mono);font-weight:600;color:var(--ink)}
/* per-layer impact meter (diverging) */
.impact{margin:0 0 14px}
.impact-track{position:relative;height:14px;background:#f1f4f8;border-radius:4px}
.impact-track::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:#d3dbe6}
.impact-fill{position:absolute;top:0;bottom:0;width:0;transition:all .55s cubic-bezier(.32,.72,.31,1)}
.impact-fill.pos{left:50%;background:linear-gradient(90deg,#34d17a,var(--pos));border-radius:0 4px 4px 0}
.impact-fill.neg{right:50%;background:linear-gradient(270deg,#f87171,var(--neg));border-radius:4px 0 0 4px}
.impact-cap{display:flex;justify-content:space-between;align-items:baseline;margin-top:7px;gap:10px}
.impact-val{font-family:var(--mono);font-weight:700;font-size:14px}
/* company cards */
.cos{display:flex;flex-wrap:wrap;gap:8px}
.co{display:flex;flex-direction:column;gap:6px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 11px 8px;cursor:pointer;transition:border-color .14s,transform .14s,box-shadow .14s;min-width:132px;text-align:left;font-family:var(--body)}
.co:hover{border-color:#cfe0ff;transform:translateY(-1px);box-shadow:0 6px 16px -10px rgba(9,20,60,.3)}
.co[aria-expanded=true]{border-color:var(--blue);box-shadow:0 0 0 3px rgba(41,112,255,.12)}
.co-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.co-tk{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--ink)}
.co-imp{font-family:var(--mono);font-weight:700;font-size:12.5px}
.co-name{font-size:11.5px;color:var(--muted);margin-top:-2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.exp{display:flex;align-items:center;gap:5px;margin-top:1px}
.exp-bar{display:flex;gap:2px}
.exp-seg{width:14px;height:4px;border-radius:2px;background:#e5eaf1}
.co.hi .exp-seg{background:var(--e-hi)}
.co.mid .exp-seg:nth-child(-n+2){background:var(--e-mid)}
.co.lo .exp-seg:nth-child(1){background:var(--e-lo)}
.exp-lbl{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
/* detail */
.detail{margin:12px 0 2px;flex-basis:100%;width:100%;background:#f8fafc;border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:12px;padding:15px 17px}
.detail h4{font-family:var(--serif);font-weight:600;font-size:17px;margin:0 0 1px}
.detail .sub{font-family:var(--mono);font-size:11px;color:var(--faint);margin-bottom:12px}
.detail .rows{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:13px}
.detail .row-k{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:3px}
.detail .row-v{font-size:14px;font-weight:600}
.detail p.note{font-size:13.5px;color:#334155;margin:13px 0 0;line-height:1.5}
.detail .watch{margin:11px 0 0;font-size:13px;color:#334155;background:#eef4ff;border:1px solid #cfe0ff;border-radius:10px;padding:9px 12px;line-height:1.45}
.detail .watch b{display:block;font-size:9.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--blue);margin-bottom:3px}
.detail .live{margin:12px 0 0;background:#f0fdf4;border:1px solid #bfe6cb;border-radius:11px;padding:11px 13px}
.detail .live-h{display:flex;align-items:center;gap:7px;font-size:9.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:#0a7d33;margin-bottom:9px}
.detail .live-dot{width:7px;height:7px;border-radius:50%;background:#0a7d33;box-shadow:0 0 0 3px rgba(10,125,51,.15);animation:lpulse 1.8s infinite}
@keyframes lpulse{0%,100%{opacity:1}50%{opacity:.35}}
.detail .live-load{font-size:12.5px;color:var(--muted)}
.detail .live-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px}
.detail .live-grid .lk,.detail .live-line .lk{display:block;font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#78a389;margin-bottom:2px}
.detail .live-grid .lv{font-size:13.5px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.detail .live-line{font-size:13px;color:#334155;line-height:1.45;margin-top:9px;border-top:1px solid #d4eddb;padding-top:8px}
.detail .live-line:first-of-type{border-top:0;padding-top:0}
.detail .open{display:inline-block;margin-top:12px;font-size:12.5px;font-weight:700;color:var(--blue);text-decoration:none}
.detail .open:hover{text-decoration:underline}
/* foot */
.foot{margin:40px 0 0;padding:24px 0 10px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);line-height:1.6}
.foot h5{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);margin:0 0 6px}
.foot p{margin:0 0 14px;max-width:74ch}
.cta{display:inline-block;margin-top:4px;font-size:13px;font-weight:700;color:#fff;background:var(--blue);padding:11px 18px;border-radius:11px;text-decoration:none}
.cta:hover{background:var(--blue-d)}
.disc{font-size:12px;color:var(--faint);line-height:1.55;margin-top:18px;border-top:1px solid var(--line);padding-top:14px;max-width:78ch}
.loading{padding:70px 20px;text-align:center;color:var(--faint);font-size:14px}
@media(max-width:640px){
  .layer{grid-template-columns:1fr;gap:14px}
  .spine{display:none}.node{display:none}.layer-meta{padding-left:0}
  .mv{grid-template-columns:82px 1fr 54px;gap:9px}
  .wrap{padding:24px 16px 60px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="back" href="/theses">← All thesis maps</a>
  <a class="brand" href="/"><span class="mark"></span><span>TickerMover</span></a>
</div></header>

<main class="wrap">
  <span class="eyebrow">◇ <span id="crumb">Chain Map</span></span>
  <h1 class="title" id="title">Loading…</h1>
  <p class="standfirst" id="standfirst"></p>

  <div class="control" id="control" style="display:none">
    <div class="control-head">
      <span class="control-label" id="control-label"></span>
      <span class="readout" id="readout"></span>
    </div>
    <div class="presets" id="presets"></div>
    <input type="range" id="slider" aria-label="Driver">
    <div class="scale"><span id="scale-lo"></span><span>0%</span><span id="scale-hi"></span></div>
  </div>

  <div class="money" id="money" style="display:none"></div>

  <div class="movers" id="movers" style="display:none">
    <div class="movers-h"><b>Biggest implied movers</b><span id="movers-sub"></span></div>
    <div id="movers-list"></div>
  </div>

  <div class="winners" id="winners" style="display:none"></div>

  <div class="chain" id="chain"><div class="loading">Loading map…</div></div>

  <footer class="foot" id="foot" style="display:none">
    <h5>How to read this</h5>
    <p id="how"></p>
    <a class="cta" href="/theses">← Explore more thesis maps</a>
    <p class="disc" id="disclaimer"></p>
  </footer>
</main>

<script>
(function(){
  var slug = location.pathname.split("/").filter(Boolean).pop();
  var slider = document.getElementById("slider");
  var readout = document.getElementById("readout");
  var chain = document.getElementById("chain");
  var LAYERS = [], EXP_W = {hi:1.0, mid:0.55, lo:0.22};

  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function signed(v){ return (v>0?"+":"") + v.toFixed(0) + "%"; }
  function toneClass(v){ return v>0.5?"pos":(v<-0.5?"neg":"zero"); }
  // Rank-shaded bar fill: a leaderboard should read as a ranking, not one flat
  // block. Deepest / most-saturated = top of the list, fading down. Hue stays
  // green for gains / red for losses so direction is never ambiguous.
  function barCss(rank, total, pos){
    var f = total>1 ? rank/(total-1) : 0;   // 0 at the top of the list
    if(pos){ var l = 30 + f*25; return "linear-gradient(90deg,hsl(150 52% "+(l+15)+"%),hsl(150 60% "+l+"%))"; }
    var r = 44 + f*18; return "linear-gradient(90deg,hsl(3 70% "+(r+13)+"%),hsl(3 74% "+r+"%))";
  }
  // Turn a per-layer lag (quarters from the driver) into a plain-language
  // arrival time, so "when does the money get here" is impossible to miss.
  function whenBig(lag){ return lag===0 ? "Now" : "+"+lag+"Q"; }
  function whenHorizon(lag){ return lag===0 ? "lands here first, this quarter" : "≈ "+(lag*3)+" months after the spend"; }
  function fmtP(v){ return v==null?"—":"$"+Number(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function pctSp(v,suf){ if(v==null) return ""; var cls=v>=0?"pos-t":"neg-t"; return '<span class="'+cls+'">'+(v>=0?"+":"")+Number(v).toFixed(1)+"% "+suf+'</span>'; }
  function fmtDate(s){ if(!s) return ""; try{ var d=new Date(String(s).slice(0,10)+"T00:00:00"); if(isNaN(d)) return esc(s); return "~"+d.toLocaleDateString("en-US",{month:"short",day:"numeric"}); }catch(e){ return esc(s); } }
  // Freshness helpers — so a reader can trust how current the numbers are.
  function fmtAsOf(s){ if(!s) return ""; try{ var d=new Date(String(s).slice(0,10)+"T00:00:00"); if(isNaN(d)) return esc(s); return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}); }catch(e){ return esc(s); } }
  function fmtAge(sec){ if(sec==null) return ""; sec=+sec; if(sec<90) return "just now"; if(sec<3600) return Math.round(sec/60)+"m ago"; if(sec<86400) return Math.round(sec/3600)+"h ago"; return Math.round(sec/86400)+"d ago"; }

  // Live catalyst/order-book pulled from the app's DETERMINISTIC per-ticker scan
  // (/api/catalyst — no AI cost). Injected into the open detail panel; on any
  // miss or off-universe name it silently removes itself and the stock-page link
  // remains the fallback.
  function loadLive(tk, el){
    var box=document.createElement("div");
    box.className="live";
    box.innerHTML='<div class="live-h"><span class="live-dot"></span>Live now</div><div class="live-load">Fetching current read…</div>';
    var link=el.querySelector(".open");
    if(link) el.insertBefore(box, link); else el.appendChild(box);
    fetch("/api/catalyst/"+encodeURIComponent(tk)).then(function(r){return r.json();}).then(function(d){
      if(!d || d.available===false){ box.remove(); return; }
      var grid='<div class="live-grid">'+
        (d.next_earnings?'<div><span class="lk">Earnings due</span><span class="lv">'+fmtDate(d.next_earnings)+'</span></div>':'')+
        (d.read?'<div><span class="lk">Our read</span><span class="lv">'+esc(d.read)+'</span></div>':'')+
      '</div>';
      // Prefer the richer sentence lifted from our cached AI note; fall back to
      // the deterministic scan signal.
      var backlog = d.ai_backlog || d.backlog;
      var catalyst = d.ai_catalyst || d.catalyst;
      var aiTag = (d.ai_backlog || d.ai_catalyst) ? ' + AI note' : '';
      var lines='';
      if(backlog)  lines+='<div class="live-line"><span class="lk">Order book / backlog</span>'+esc(backlog)+'</div>';
      if(catalyst) lines+='<div class="live-line"><span class="lk">'+(d.ai_catalyst?'Latest catalyst':'Latest signal')+'</span>'+esc(catalyst)+'</div>';
      var age = d.scanned_age_sec!=null ? ' · updated '+fmtAge(d.scanned_age_sec) : '';
      box.innerHTML='<div class="live-h"><span class="live-dot"></span>Live now · from our scan'+aiTag+age+'</div>'+grid+lines;
    }).catch(function(){ box.remove(); });
  }

  function build(d){
    document.getElementById("crumb").textContent = d.eyebrow || "Chain Map";
    var t = d.title || "";
    document.getElementById("title").innerHTML =
      (d.accent && t.indexOf(d.accent)>=0) ? esc(t).replace(esc(d.accent), "<em>"+esc(d.accent)+"</em>") : esc(t);
    document.getElementById("standfirst").textContent = d.standfirst || "";
    document.title = (d.title || "Thesis Map") + " — TickerMover";

    var ctl = d.control || {};
    document.getElementById("control-label").textContent = ctl.label || "Driver, year over year";
    slider.min = (ctl.min!=null?ctl.min:-30);
    slider.max = (ctl.max!=null?ctl.max:70);
    slider.step = (ctl.step!=null?ctl.step:5);
    slider.value = (ctl.value!=null?ctl.value:20);
    document.getElementById("scale-lo").textContent = slider.min + "%";
    document.getElementById("scale-hi").textContent = "+" + slider.max + "%";
    // scenario presets spanning the range
    var lo=+slider.min, hi=+slider.max;
    var scn=[["Downturn",Math.round(lo*0.6/5)*5],["Flat",0],["Base",Math.round(hi*0.35/5)*5],["Boom",Math.round(hi*0.8/5)*5]];
    document.getElementById("presets").innerHTML = scn.map(function(s){
      return '<button class="preset" data-v="'+s[1]+'">'+s[0]+' · '+(s[1]>0?"+":"")+s[1]+'%</button>';
    }).join("");
    document.getElementById("control").style.display = "";
    document.getElementById("movers").style.display = "";

    LAYERS = d.layers || [];
    chain.innerHTML =
      '<h2 class="sec-h">The chain</h2>'+
      '<p class="sec-sub">The money doesn\'t hit every layer at once — it arrives in waves. Each layer is tagged with <b>when</b> the spend actually shows up, from <b>Now</b> at the top to quarters out below. That lag is the edge: the later layers haven\'t been priced yet. Tap any company for the full read.</p>'+
      (d.as_of?'<p class="sec-asof"><span class="asof-dot"></span>Lag &amp; exposure are our estimates <b>as of '+fmtAsOf(d.as_of)+'</b> — the forward layers haven\'t been paid out yet. Each company\'s price and read update live below.</p>':'')+
      LAYERS.map(function(L,i){
        var nm = L.names || [];
        var hiN = nm.filter(function(c){return c.exposure==="hi";}).length;
        var midN = nm.filter(function(c){return c.exposure==="mid";}).length;
        var loN = nm.filter(function(c){return c.exposure==="lo";}).length;
        var mix = "";
        for(var h=0;h<hiN;h++) mix+='<span class="ls-seg hi"></span>';
        for(var m=0;m<midN;m++) mix+='<span class="ls-seg mid"></span>';
        for(var l=0;l<loN;l++) mix+='<span class="ls-seg lo"></span>';
        // "lead" = the highest-exposure name in the layer (its purest read)
        var lead = (nm.filter(function(c){return c.exposure==="hi";})[0] || nm[0] || {}).t || "";
        var sum =
          '<div class="layer-sum">'+
            '<div class="ls-row"><span class="ls-k">Exposure</span><span class="ls-mix">'+mix+'</span>'+
              '<span>'+nm.length+' name'+(nm.length!==1?"s":"")+'</span></div>'+
            (lead?'<div class="ls-row"><span class="ls-k">Purest read</span><span class="ls-lead">'+esc(lead)+'</span></div>':'')+
          '</div>';
        return '<section class="layer" style="--lc:'+esc(L.color||"var(--blue)")+'">'+
          '<div class="layer-meta"><span class="spine"></span><span class="node"></span>'+
            '<span class="layer-idx">'+esc(L.id)+' · lag '+L.lag+'Q</span>'+
            '<h3 class="layer-name">'+esc(L.name)+'</h3>'+
            '<div class="layer-when-badge '+(L.lag===0?"first":"")+'"><span class="lw-k">Money arrives</span><span class="lw-v">'+whenBig(L.lag)+'</span><span class="lw-h">'+whenHorizon(L.lag)+'</span></div>'+
            '<p class="layer-lag">'+esc(L.lagText)+'</p>'+
            sum+
          '</div>'+
          '<div>'+
            '<div class="impact"><div class="impact-track"><div class="impact-fill" data-fill="'+i+'"></div></div>'+
              '<div class="impact-cap"><span class="impact-val" data-lval="'+i+'"></span></div></div>'+
            '<div class="cos">'+ (L.names||[]).map(function(c,j){
              return '<button class="co '+esc(c.exposure)+'" data-l="'+i+'" data-c="'+j+'" aria-expanded="false">'+
                '<span class="co-top"><span class="co-tk">'+esc(c.t)+'</span><span class="co-imp" data-imp="'+i+'-'+j+'"></span></span>'+
                '<span class="co-name">'+esc(c.n)+'</span>'+
                '<span class="exp"><span class="exp-bar"><i class="exp-seg"></i><i class="exp-seg"></i><i class="exp-seg"></i></span>'+
                  '<span class="exp-lbl">'+({hi:"High",mid:"Mod",lo:"Low"}[c.exposure]||"")+' exp</span></span>'+
              '</button>';
            }).join("") +'</div>'+
          '</div>'+
        '</section>';
      }).join("");

    // "Follow the money" — curated market size for the thesis
    var mk = d.market;
    if(mk && mk.stats && mk.stats.length){
      var mEl = document.getElementById("money");
      mEl.innerHTML =
        '<div class="money-h"><b>Follow the money</b><span>the size of the prize</span></div>'+
        '<div class="money-stats">'+ mk.stats.map(function(s){
          return '<div class="money-stat"><div class="mo-v">'+esc(s.v)+'</div><div class="mo-k">'+esc(s.k)+'</div>'+
            (s.bar!=null?'<div class="mo-bar"><i style="width:'+Math.max(3,Math.min(100,s.bar))+'%"></i></div>':'')+'</div>';
        }).join("") +'</div>'+
        (mk.note?'<div class="money-note">'+esc(mk.note)+'</div>':'');
      mEl.style.display = "";
    }

    document.getElementById("how").textContent = d.how || "";
    document.getElementById("disclaimer").textContent = d.disclaimer || "";
    document.getElementById("foot").style.display = "";
    render();
    loadPerf();
  }

  // "Who's gained so far" — REAL returns from the deterministic universe scan.
  function loadPerf(){
    var el = document.getElementById("winners");
    fetch("/api/thesis-perf/"+encodeURIComponent(slug)).then(function(r){return r.json();}).then(function(d){
      var cos = ((d && d.companies) || []).filter(function(c){return c.ret_3m!=null;});
      if(cos.length < 2){ el.style.display="none"; return; }
      cos.sort(function(a,b){ return (b.ret_3m||0)-(a.ret_3m||0); });
      var top = cos.slice(0,6);
      var maxAbs = Math.max.apply(null, cos.map(function(c){return Math.abs(c.ret_3m||0);}).concat([1]));
      var up = cos.filter(function(c){return (c.ret_3m||0) > 0;}).length;
      var rows = top.map(function(c,i){
        var v = c.ret_3m||0, pos = v>=0, w = Math.max(2, Math.abs(v)/maxAbs*100);
        return '<div class="mv"><span class="mv-tk">'+esc(c.t)+'<small>'+esc(c.n)+'</small></span>'+
          '<span class="mv-track"><span class="mv-fill '+(pos?"pos":"neg")+'" style="width:'+w.toFixed(1)+'%;background:'+barCss(i,top.length,pos)+'"></span></span>'+
          '<span class="mv-val '+(pos?"pos-t":"neg-t")+'">'+(pos?"+":"")+v.toFixed(1)+'%</span></div>';
      }).join("");
      el.innerHTML =
        '<div class="winners-h"><b>Who’s gained so far</b><span>'+up+' of '+cos.length+' names up · 3-month return, live</span></div>'+ rows;
      el.style.display = "";
    }).catch(function(){ el.style.display="none"; });
  }

  function render(){
    var g = +slider.value;
    readout.innerHTML = (g>0?"+":"") + g + '<small>%</small>';
    document.querySelectorAll(".preset").forEach(function(b){ b.classList.toggle("on", +b.dataset.v===g); });

    var movers = [];
    LAYERS.forEach(function(L,i){
      var eff = g * (1 - L.lag*0.07);
      var fill = document.querySelector('[data-fill="'+i+'"]');
      var frac = Math.min(1, Math.abs(eff)/Math.max(1,Math.abs(+slider.max)));
      fill.className = "impact-fill " + (eff>0.5?"pos":(eff<-0.5?"neg":"pos"));
      fill.style.width = (frac*50).toFixed(1) + "%";
      fill.style.opacity = Math.abs(eff)<0.5 ? "0" : "1";
      var lv = document.querySelector('[data-lval="'+i+'"]');
      lv.textContent = signed(eff);
      lv.className = "impact-val " + toneClass(eff) + "-t";
      // per-company implied + collect for leaderboard
      (L.names||[]).forEach(function(c,j){
        var imp = eff * (EXP_W[c.exposure]||0.3);
        var chip = document.querySelector('[data-imp="'+i+'-'+j+'"]');
        chip.textContent = signed(imp);
        chip.className = "co-imp " + toneClass(imp) + "-t";
        movers.push({t:c.t, n:c.n, imp:imp});
      });
      var layerEl = fill.closest(".layer");
      layerEl.classList.remove("lit"); void layerEl.offsetWidth;
      setTimeout(function(){ layerEl.classList.add("lit"); }, L.lag*120);
    });

    // leaderboard — biggest implied moves, by magnitude, colored by direction
    document.getElementById("movers-sub").textContent =
      "at " + (g>0?"+":"") + g + "% · exposure-weighted, illustrative";
    movers.sort(function(a,b){ return Math.abs(b.imp)-Math.abs(a.imp); });
    var top = movers.slice(0,6);
    var maxAbs = Math.max.apply(null, top.map(function(m){return Math.abs(m.imp);}).concat([1]));
    document.getElementById("movers-list").innerHTML = top.map(function(m,i){
      var pos = m.imp>=0, w = Math.max(2, Math.abs(m.imp)/maxAbs*100);
      return '<div class="mv"><span class="mv-tk">'+esc(m.t)+'<small>'+esc(m.n)+'</small></span>'+
        '<span class="mv-track"><span class="mv-fill '+(pos?"pos":"neg")+'" style="width:'+w.toFixed(1)+'%;background:'+barCss(i,top.length,pos)+'"></span></span>'+
        '<span class="mv-val '+(pos?"pos-t":"neg-t")+'">'+signed(m.imp)+'</span></div>';
    }).join("");
  }

  chain.addEventListener("click", function(e){
    var co = e.target.closest(".co");
    if(!co) return;
    var L = LAYERS[+co.dataset.l], c = L.names[+co.dataset.c];
    var cos = co.parentElement;
    var open = cos.parentElement.querySelector(".detail");
    var wasSame = open && open.dataset.key === co.dataset.l+"-"+co.dataset.c;
    cos.querySelectorAll(".co").forEach(function(x){ x.setAttribute("aria-expanded","false"); });
    if(open) open.remove();
    if(wasSame) return;
    co.setAttribute("aria-expanded","true");
    var expLabel = {hi:"High",mid:"Moderate",lo:"Low"}[c.exposure] || "—";
    var d = document.createElement("div");
    d.className = "detail"; d.dataset.key = co.dataset.l+"-"+co.dataset.c;
    d.innerHTML =
      '<h4>'+esc(c.n)+'</h4>'+
      '<p class="sub">'+esc(c.t)+' · '+esc(L.id)+' '+esc(L.name)+' · lag '+L.lag+'Q</p>'+
      '<div class="rows">'+
        '<div><div class="row-k">Capex exposure</div><div class="row-v">'+expLabel+'</div></div>'+
        '<div><div class="row-k">Cycle stage</div><div class="row-v">'+esc(c.stage)+'</div></div>'+
        '<div><div class="row-k">Customer concentration</div><div class="row-v">'+esc(c.concen)+'</div></div>'+
      '</div>'+
      '<p class="note">'+esc(c.note)+'</p>'+
      (c.watch?'<p class="watch"><b>Signal to watch</b>'+esc(c.watch)+'</p>':'')+
      '<a class="open" href="/stocks/'+encodeURIComponent(c.t)+'">See '+esc(c.t)+'’s full page on TickerMover →</a>';
    cos.parentElement.appendChild(d);
    loadLive(c.t, d);
  });

  document.getElementById("presets").addEventListener("click", function(e){
    var b = e.target.closest(".preset"); if(!b) return;
    slider.value = b.dataset.v; render();
  });
  slider.addEventListener("input", render);

  fetch("/api/thesis-map/"+encodeURIComponent(slug)+"?v=2")
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(d){ if(!d || d.available===false || !d.layers) throw new Error("unavailable"); build(d); })
    .catch(function(){
      document.getElementById("title").textContent = "This thesis map isn't available";
      chain.innerHTML = '<div class="loading">It may still be in preparation. <a href="/theses">Browse all thesis maps →</a></div>';
    });
})();
</script>
</body>
</html>
