<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Market Movers — Weekly Stock Market Analysis &amp; Stocks to Watch | TickerMover</title>
  <meta name="description" content="TickerMover's signed weekly editorial — a long-form, data-grounded deep-dive into the week's most important sector or stock, written by our desk.">
  <link rel="icon" type="image/svg+xml" href="/static/brand/tickermover-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Literata:ital,opsz,wght@0,7..72,300;0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
  <style>
    :root{
  /* ---- motion scale (single source of truth; see _motion_preview.html) ---- */
  --t-fast:140ms; --t-base:240ms; --t-slow:420ms; --t-draw:900ms;
  --e-out:cubic-bezier(.2,.7,.2,1);
  --e-spring:cubic-bezier(.34,1.56,.64,1);
--blue:#14587D;--ink:#0A2F46;--muted:#475569}
    *{box-sizing:border-box}
    body{margin:0;background:#fcfbf9;color:var(--ink);
      font-family:'Public Sans',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.6}
    a{color:var(--blue)}
    .top{position:sticky;top:0;z-index:20;background:rgba(252,251,249,.86);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid rgba(10,47,70,.07)}
    .top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px}
    .brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:600;font-size:19px;letter-spacing:-.022em;color:#0a0a0a}
    .brand .mark{width:30px;height:30px;flex:none;background:linear-gradient(135deg,#8FBFDD 0%,#14587D 50%,#0A2F46 100%);
      -webkit-mask:url('/static/brand/tickermover-mark-mask.svg') center/contain no-repeat;mask:url('/static/brand/tickermover-mark-mask.svg') center/contain no-repeat}
    .cta{display:inline-flex;align-items:center;gap:6px;background:var(--blue);color:#fff;text-decoration:none;font-size:13px;font-weight:600;padding:8px 15px;border-radius:9px}
    .wrap{max-width:720px;margin:0 auto;padding:30px 20px 70px}
    /* Reading layout — the issue page runs wider than the newsstand and gains a
       sticky contents rail, matching the reference article's proportions
       (890px of text, a ~250px rail). The old 720px wrap left a 610px measure,
       which made a 3,700-word report look like a wall and buried the section
       structure the writer had actually planned. */
    body.issue .wrap{max-width:1240px;padding-top:26px}
    .issue-grid{display:grid;grid-template-columns:250px minmax(0,1fr);gap:46px;align-items:start}
    .issue-main{min-width:0;max-width:890px}
    .rail{position:sticky;top:22px;align-self:start}
    .rail-h{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#94a3b8;margin:0 0 12px}
    .rail-toc{list-style:none;margin:0;padding:0;border-left:2px solid #e6edf7}
    .rail-toc a{display:flex;gap:9px;padding:7px 0 7px 13px;margin-left:-2px;border-left:2px solid transparent;
      font-size:13px;line-height:1.35;color:#5d6c7b;text-decoration:none;transition:color var(--t-fast),border-color var(--t-fast)}
    .rail-toc a:hover{color:var(--blue);border-left-color:#E4E7EC}
    .rail-toc a.on{color:var(--ink,#0A2F46);font-weight:700;border-left-color:var(--blue)}
    .rail-toc .n{color:#94a3b8;font-variant-numeric:tabular-nums;flex:none}
    .rail-cta{margin-top:22px;padding:15px;border:1px solid #e6edf7;border-radius:12px;background:#f8fbff}
    .rail-cta b{display:block;font-size:13.5px;color:var(--ink,#0A2F46);margin-bottom:5px}
    .rail-cta p{font-size:12.5px;color:#64748b;line-height:1.5;margin:0 0 11px}
    .rail-cta a{display:inline-block;font-size:12.5px;font-weight:700;color:#fff;background:var(--blue);
      padding:8px 14px;border-radius:8px;text-decoration:none}
    @media(max-width:1080px){
      .issue-grid{grid-template-columns:1fr;gap:0}
      .rail{position:static;margin:0 0 26px}
      .rail-cta{display:none}
      body.issue .wrap{max-width:820px}
    }
    /* Hero photo — the article opens on the issue's stock image, which is what
       a reader actually stops on. (The newsstand cover stays drawn.) */
    .issue-hero{position:relative;width:100%;aspect-ratio:16/8;border-radius:14px;overflow:hidden;
      margin:0 0 8px;background:#eef2f8}
    .issue-hero img{width:100%;height:100%;object-fit:cover;display:block}
    .issue-hero .cap{position:absolute;left:0;right:0;bottom:0;padding:26px 22px 15px;color:#fff;
      background:linear-gradient(180deg,rgba(4,10,26,0),rgba(4,10,26,.82));font-size:11px;font-weight:600;letter-spacing:.04em}
    .issue-cred{font-size:12.5px;color:#94a3b8;margin:0 0 22px}
    .issue-cred a{color:#94a3b8}
    /* Headline block — big sans, like the reference, not the serif cover face. */
    .issue-h1{font-size:clamp(30px,4vw,46px);line-height:1.13;font-weight:800;letter-spacing:-.02em;
      color:var(--ink,#0A2F46);margin:14px 0 14px}
    .issue-stand{font-size:19px;line-height:1.55;font-weight:600;color:#334155;margin:0 0 20px;max-width:62ch}
    /* Key-points box — the reference's amber contents card, used here for the
       house view, which is the one thing a reader must not miss. */
    .keybox{background:#fff8e6;border:1px solid #f5d98a;border-left:4px solid #e8a33d;border-radius:10px;
      padding:17px 20px;margin:0 0 26px}
    /* Callout — a boxed aside for the thing worth stopping on: a worked
       example, a risk, a definition. Ruled border with a round icon badge
       breaking the top-left corner, per the reference article. Deliberately
       plain inside: it earns attention from placement, not decoration. */
    .callout{position:relative;border:2px solid #0f2a5e;border-radius:4px;padding:26px 24px 20px;margin:34px 0 30px}
    .callout-badge{position:absolute;top:-21px;left:20px;width:42px;height:42px;border-radius:50%;
      background:#0f2a5e;color:#ffc75f;display:flex;align-items:center;justify-content:center;font-size:19px;line-height:1}
    .callout h4{font-size:18px;font-weight:800;line-height:1.3;color:#0f2a5e;margin:0 0 12px;letter-spacing:-.01em}
    .callout p{font-size:15.5px;line-height:1.65;color:#334155;margin:0 0 12px}
    .callout p:last-child{margin-bottom:0}
    .callout ul{margin:0 0 12px;padding-left:20px}
    .callout li{font-size:15.5px;line-height:1.6;color:#334155;margin-bottom:6px}
    .callout.warn{border-color:#b45309}.callout.warn .callout-badge{background:#b45309;color:#fff}
    .callout.warn h4{color:#8a4708}
    .callout.good{border-color:#15803d}.callout.good .callout-badge{background:#15803d;color:#fff}
    .callout.good h4{color:#10632f}
    @media(max-width:560px){ .callout{padding:22px 16px 16px}.callout h4{font-size:16px} }
    .keybox h4{font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:#a86a12;margin:0 0 8px}
    .keybox p{font-size:16px;line-height:1.6;color:#3f3016;margin:0}

    .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--blue)}
    .byline{display:flex;align-items:center;gap:9px;margin:14px 0 4px;font-size:13.5px;color:var(--muted)}
    .byline .tm-coin{flex:none;display:block}
    .byline b{color:var(--ink);font-weight:600}
    h1.title{font-family:'Literata',Georgia,serif;font-weight:600;font-size:clamp(28px,5vw,42px);line-height:1.1;letter-spacing:-.015em;margin:14px 0 12px}
    .standfirst{font-size:18px;line-height:1.5;color:#334155;font-weight:400;margin:0 0 22px}
    .chips{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 26px}
    .chip{font-size:12px;font-weight:700;color:#0A2F46;background:#F2F1EE;border:1px solid #E4E7EC;border-radius:7px;padding:4px 10px;text-decoration:none}
    .chip:hover{background:#e0ecff}
    .article{font-size:17px;line-height:1.72;color:#1e293b}
    .article h2{font-family:'Literata',Georgia,serif;font-weight:600;font-size:25px;line-height:1.2;margin:38px 0 12px;letter-spacing:-.01em}
    .article h3{font-size:18px;font-weight:700;margin:26px 0 8px}
    .article p{margin:0 0 18px}
    .article ul,.article ol{margin:0 0 18px;padding-left:22px}
    .article li{margin:0 0 7px}
    .article strong{font-weight:700;color:#0A2F46}
    .article em{font-style:italic}
    .pull{font-family:'Literata',Georgia,serif;font-style:italic;font-weight:500;font-size:24px;line-height:1.35;color:#0A2F46;border-left:4px solid var(--blue);padding:6px 0 6px 20px;margin:30px 0}
    .houseview{background:linear-gradient(180deg,#F2F1EE,#f8fbff);border:1px solid #E4E7EC;border-radius:16px;padding:20px 22px;margin:34px 0 10px}
    .houseview .h{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#0A2F46;margin-bottom:7px}
    .houseview .t{font-size:16.5px;line-height:1.6;color:#1e293b}
    .sources{margin-top:34px;padding-top:18px;border-top:1px solid rgba(10,47,70,.1)}
    .sources .h{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#94a3b8;margin-bottom:8px}
    .sources a{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;text-decoration:none}
    .sources a:hover{color:var(--blue)}
    .disc{font-size:12.5px;color:#94a3b8;line-height:1.55;margin-top:30px;border-top:1px solid rgba(10,47,70,.08);padding-top:16px}
    .loading,.empty{text-align:center;color:#64748b;padding:80px 20px;font-size:15px}
    @media(max-width:560px){ .wrap{padding:22px 17px 60px} .article{font-size:16px} }
    /* consulting-report additions: action bar, bottom-line, data tables, print */
    .actionbar{display:flex;gap:8px;margin:2px 0 20px;flex-wrap:wrap}
    .abtn{display:inline-flex;align-items:center;gap:6px;font-family:inherit;font-size:12.5px;font-weight:600;color:#0A2F46;background:#fff;border:1px solid #E4E7EC;border-radius:9px;padding:7px 13px;cursor:pointer;transition:background var(--t-fast);text-decoration:none;white-space:nowrap}
    .abtn:hover{background:#F2F1EE}
    .bottomline{background:linear-gradient(180deg,#F2F1EE,#f8fbff);border:1px solid #E4E7EC;border-radius:16px;padding:18px 20px;margin:0 0 22px}
    .bottomline .h{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#0A2F46;margin-bottom:7px}
    .bottomline .t{font-size:17px;line-height:1.6;color:#1e293b;font-weight:500}
    .tablewrap{overflow-x:auto;margin:0 0 22px}
    .article table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.45}
    .article th,.article td{text-align:left;padding:9px 12px;border-bottom:1px solid #e2e8f0;vertical-align:top}
    .article thead th{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#475569;background:#f1f5f9;border-bottom:2px solid #cbd5e1}
    .article tbody tr:last-child td{border-bottom:none}
    /* data charts — pure-CSS horizontal bars built from ground-truth numbers */
    .charts{margin:26px 0 6px}
    .chart{background:#fff;border:1px solid #e6edf7;border-radius:14px;padding:16px 18px 14px;margin:0 0 16px}
    .chart .ch-h{font-size:14px;font-weight:800;color:#0A2F46;letter-spacing:-.01em;margin:0 0 12px;display:flex;align-items:baseline;gap:8px}
    .chart .ch-unit{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#94a3b8}
    .ch-row{display:grid;grid-template-columns:88px 1fr auto;align-items:center;gap:10px;margin:0 0 8px}
    .ch-row:last-of-type{margin-bottom:0}
    .ch-lab{font-size:12.5px;font-weight:700;color:#334155;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ch-track{position:relative;height:15px;background:#eef2f8;border-radius:8px;overflow:hidden}
    .ch-fill{position:absolute;inset:0 auto 0 0;border-radius:8px;background:linear-gradient(90deg,#8FBFDD,#14587D);min-width:3px}
    .ch-fill.neg{background:linear-gradient(90deg,#fca5a5,#ef4444)}
    .ch-fill.hi{background:linear-gradient(90deg,#14587D,#0A2F46);box-shadow:0 0 0 1.5px rgba(20,88,125,.35)}
    .ch-val{font-size:12.5px;font-weight:800;color:#0A2F46;font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
    .ch-note{font-size:12.5px;color:#64748b;margin:11px 0 0;line-height:1.5}
    @media(max-width:560px){ .ch-row{grid-template-columns:64px 1fr auto;gap:8px} .ch-lab{font-size:12.5px} }
    /* ── line — a trend through ordered periods ── */
    .ch-line{width:100%;height:auto;aspect-ratio:600/172;display:block;overflow:visible}
    .ch-line .ln-path{fill:none;stroke:#14587D;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
    .ch-line .ln-dot{fill:#fff;stroke:#14587D;stroke-width:2.5}
    .ch-line .ln-dot.hi{fill:#14587D}
    .ch-line .ln-zero{stroke:#cbd5e1;stroke-width:1;stroke-dasharray:3 3}
    .ch-line .ln-lab{font-size:12.5px;font-weight:700;fill:#94a3b8}
    .ch-line .ln-v{font-size:12.5px;font-weight:800;fill:#0A2F46}
    /* ── waterfall — one change decomposed into its contributions ── */
    .ch-wf{display:flex;align-items:flex-end;gap:8px;height:152px;padding-top:6px}
    .wf-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
    .wf-bar{width:100%;max-width:52px;border-radius:5px;background:linear-gradient(180deg,#8FBFDD,#14587D);min-height:3px}
    .wf-bar.neg{background:linear-gradient(180deg,#fca5a5,#ef4444)}
    .wf-bar.hi{background:linear-gradient(180deg,#334155,#0A2F46)}
    .wf-v{font-size:12.5px;font-weight:800;color:#0A2F46;margin-bottom:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
    .wf-l{font-size:10.5px;font-weight:700;color:#64748b;margin-top:6px;text-align:center;line-height:1.25;
      overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
    /* ── grouped — two comparable series per item ── */
    .gr-t{position:relative;height:11px;background:#eef2f8;border-radius:6px;overflow:hidden;margin-bottom:3px}
    .gr-t:last-child{margin-bottom:0}
    .gr-f{position:absolute;inset:0 auto 0 0;border-radius:6px;background:linear-gradient(90deg,#8FBFDD,#14587D);min-width:3px}
    .gr-f.s2{background:linear-gradient(90deg,#cbd5e1,#94a3b8)}
    .gr-f.neg{background:linear-gradient(90deg,#fca5a5,#ef4444)}
    .ch-key{display:flex;gap:14px;margin:0 0 10px;font-size:12.5px;font-weight:700;color:#64748b}
    .ch-key span{display:inline-flex;align-items:center;gap:5px}
    .ch-key i{width:11px;height:11px;border-radius:3px;display:inline-block}
    /* ── gauge — a single 0-100 reading ── */
    .ch-gauge{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
    .gg-svg{width:152px;height:90px;flex:none}
    .gg-track{fill:none;stroke:#eef2f8;stroke-width:13;stroke-linecap:round}
    .gg-fill{fill:none;stroke:#14587D;stroke-width:13;stroke-linecap:round}
    .gg-read{font-size:34px;font-weight:800;color:#0A2F46;line-height:1;font-variant-numeric:tabular-nums}
    .gg-lab{font-size:12.5px;font-weight:700;color:#64748b;margin-top:4px}
    @media(max-width:560px){ .ch-wf{height:128px} .wf-l{font-size:9.5px} }
    /* donut chart — share of a whole */
    .dn-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
    .dn-svg{flex:none}
    .dn-leg{display:flex;flex-direction:column;gap:8px;min-width:150px;flex:1}
    .dn-li{display:flex;align-items:center;gap:9px;font-size:13px;color:#334155}
    .dn-dot{width:11px;height:11px;border-radius:3px;flex:none}
    .dn-li b{margin-left:auto;font-weight:800;color:#0A2F46;font-variant-numeric:tabular-nums}
    /* Blinkit-style hero stat tiles */
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:0 0 24px}
    .stat{background:#fff;border:1px solid #e6edf7;border-radius:14px;padding:15px 16px;position:relative;overflow:hidden}
    .stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sc,#14587D)}
    .stat-v{font-family:'Literata',Georgia,serif;font-weight:600;font-size:30px;line-height:1;letter-spacing:-.02em;color:#0A2F46;display:flex;align-items:center;gap:6px}
    .stat-v .ar{font-size:16px;font-weight:900}
    .stat-v .up{color:#16a34a}.stat-v .down{color:#dc2626}.stat-v .flat{color:#94a3b8}
    .stat-l{font-size:12.5px;font-weight:700;color:#334155;margin-top:7px}
    .stat-s{font-size:12.5px;color:#94a3b8;margin-top:2px;line-height:1.35}
    /* scenario cards — Bear / Base / Bull */
    .scen-h{font-family:'Literata',Georgia,serif;font-weight:600;font-size:22px;letter-spacing:-.01em;margin:36px 0 14px}
    .scen{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:0 0 8px}
    .scenc{background:#fff;border:1px solid #e6edf7;border-radius:14px;padding:0 17px 16px;border-top:4px solid var(--sccol,#94a3b8);overflow:hidden}
    .scen-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:15px 0 9px}
    .scen-case{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--sccol,#475569)}
    .scen-prob{font-family:'Literata',Georgia,serif;font-weight:600;font-size:23px;line-height:1;color:#0A2F46}
    .scen-thesis{font-size:14px;line-height:1.5;color:#1e293b;font-weight:500;margin:0 0 10px}
    .scen-trig{font-size:12.5px;color:#64748b;line-height:1.45;border-top:1px dashed #e2e8f0;padding-top:9px}
    .scen-trig b{color:#475569;font-weight:700}
    /* editorial section dividers + drop cap */
    .article h2::before{content:"";display:block;width:34px;height:3px;background:var(--blue);border-radius:2px;margin:0 0 13px}
    /* drop cap only on the feature's opening page, not every paged section */
    .article.lead>p:first-of-type::first-letter{font-family:'Literata',Georgia,serif;font-weight:600;font-size:3.3em;line-height:.82;float:left;margin:6px 10px 0 0;color:var(--blue)}
    @media print{ .stat,.scenc,.chart{break-inside:avoid} .stat::before,.stat-v .up,.stat-v .down,.dn-dot{-webkit-print-color-adjust:exact;print-color-adjust:exact} }
    /* report-grade PDF: sensible page margins so "⬇ PDF" (window.print) reads
       as a document, not a screenshot of the page. */
    @page{ margin:15mm 13mm 16mm; }
    @media print{
      .top,.actionbar,.cta{display:none!important}
      html,body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
      body{background:#fff}
      .wrap{max-width:100%;padding:0 8px}
      .article{font-size:12.5px;line-height:1.55}
      .article h2{font-size:17px;margin:20px 0 8px}
      a{color:#0A2F46;text-decoration:none}
      .bottomline{break-inside:avoid}
      .article table{font-size:12.5px}
      .chart{break-inside:avoid;border-color:#cbd5e1}
      .ch-fill{-webkit-print-color-adjust:exact;print-color-adjust:exact}
      .covers,.news-h,.backlink{display:none!important}
    }
    /* ── paged book reader ─────────────────────────────────────────────
       Native scroll-snap: swipe, keyboard and a11y come free, every page
       stays in the DOM (so Google still indexes the whole issue), and there
       is no carousel library to ship. */
    body.book-mode .wrap{max-width:1180px}
    .book{display:flex;gap:22px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;
      padding:4px 2px 14px;margin:0 0 6px;scrollbar-width:none}
    .book::-webkit-scrollbar{display:none}
    .page{flex:0 0 100%;scroll-snap-align:start;background:#fff;border:1px solid #e6edf7;border-radius:16px;
      padding:30px 32px;min-height:70vh;overflow-y:auto;box-shadow:0 8px 26px -20px rgba(0,28,49,.5)}
    @media(min-width:900px){ .page{flex:0 0 calc(50% - 11px)} }   /* two-page spread */
    .page>h2:first-child,.page>.pg-h:first-child{margin-top:0}
    .pg-h{font-family:'Literata',Georgia,serif;font-weight:600;font-size:24px;letter-spacing:-.012em;margin:0 0 16px}
    .pg-num{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#94a3b8;margin-bottom:14px}
    /* page 1 — the cover, full bleed inside the page */
    .page.cover-pg{position:relative;padding:0;overflow:hidden;color:#fff;border:none;display:flex}
    .cover-pg .cp-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
    .cover-pg .cp-scrim{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(4,10,30,.45) 0%,rgba(4,10,30,.15) 40%,rgba(4,10,30,.88) 100%)}
    /* magazine-cover scrim (only added when there's a photo) — darkens a busy photo
       behind the masthead/cover-lines/headline so the type always reads cleanly */
    .cover-pg .cov-scrim{position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(6,11,28,.62) 0%,rgba(6,11,28,.30) 30%,rgba(6,11,28,.36) 56%,rgba(6,11,28,.90) 100%)}
    .cover-pg .cp-in{position:relative;z-index:2;display:flex;flex-direction:column;padding:30px;width:100%}
    .cover-pg .cp-title{font-family:'Literata',Georgia,serif;font-weight:600;font-size:clamp(26px,3.4vw,38px);line-height:1.06;letter-spacing:-.015em;margin:auto 0 12px;text-shadow:0 2px 18px rgba(0,0,0,.5)}
    .cover-pg .cp-stand{font-size:15.5px;line-height:1.5;opacity:.94;margin:0 0 16px;max-width:52ch}
    .cover-pg .cp-meta{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
    /* full-page magazine cover (bookCover) — scale the shared cover parts up */
    .cover-pg .cov-in.bookcov{padding:clamp(22px,3.2vw,40px)}
    .cover-pg .cov-mast{font-size:clamp(30px,3.8vw,44px)}
    .cover-pg .cov-mast .no{font-size:12.5px}
    .cover-pg .cov-line{font-size:clamp(12.5px,1.35vw,16px);-webkit-line-clamp:2}
    .cover-pg .cov-subj{font-size:11px;padding:4px 10px;margin-bottom:12px}
    .cover-pg .cov-title{font-size:clamp(28px,3.9vw,46px);-webkit-line-clamp:4;letter-spacing:-.018em}
    .cover-pg .bookcov-stand{font-size:clamp(14px,1.45vw,17px);line-height:1.5;opacity:.93;margin:14px 0 0;max-width:46ch;text-shadow:0 1px 8px rgba(0,0,0,.55)}
    .cover-pg .cov-date{font-size:12.5px}
    /* nav */
    .bk-bar{display:flex;align-items:center;gap:12px;margin:0 0 26px}
    .bk-btn{width:38px;height:38px;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:17px;
      color:#0A2F46;background:#fff;border:1px solid #E4E7EC;border-radius:10px;cursor:pointer;transition:background var(--t-fast)}
    .bk-btn:hover:not(:disabled){background:#F2F1EE}
    .bk-btn:disabled{opacity:.35;cursor:default}
    .bk-btn:focus-visible,.abtn:focus-visible,.cover:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
    .bk-ind{font-size:12.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
    .bk-dots{display:flex;gap:5px;margin-left:auto}
    .bk-dot{width:7px;height:7px;border-radius:50%;background:#cbd5e1;border:none;padding:0;cursor:pointer}
    .bk-dot.on{background:var(--blue)}
    .bk-toggle{margin-left:8px}
    /* ── "The Week" updates spread ── */
    .wk{display:flex;flex-direction:column;gap:11px}
    .wk-item{border-left:3px solid var(--wkc,#14587D);padding:2px 0 2px 12px}
    .wk-top{display:flex;align-items:center;gap:8px;margin-bottom:3px;flex-wrap:wrap}
    .wk-kind{font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--wkc,#14587D)}
    .wk-tix{font-size:12.5px;font-weight:800;color:#0A2F46}
    .wk-metric{margin-left:auto;font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums;color:#0A2F46}
    .wk-head{font-size:14.5px;font-weight:700;line-height:1.32;color:#0A2F46}
    .wk-detail{font-size:13px;line-height:1.5;color:#64748b;margin-top:3px}
    @media (prefers-reduced-motion: reduce){ .book{scroll-behavior:auto} }
    /* continuous-scroll fallback — better for long reads, print and screen readers */
    body.scroll-view .book{display:block;overflow:visible}
    body.scroll-view .page{flex:none;min-height:0;overflow:visible;margin:0 0 18px}
    body.scroll-view .bk-btn,body.scroll-view .bk-ind,body.scroll-view .bk-dots{display:none}
    body.scroll-view .cover-pg{min-height:60vh}
    @media print{
      .book{display:block;overflow:visible}
      .page{flex:none;min-height:0;overflow:visible;break-inside:avoid;box-shadow:none;border:none;padding:0 0 14px}
      .bk-bar,.bk-dots{display:none!important}
      .cover-pg .cp-scrim{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    }
    /* ── Newsstand covers ──────────────────────────────────────────────
       Designed, typographic covers — deliberately NOT photographic. The
       stock-photo covers put the same yellow-cable data-centre shot on four
       of five issues, so the shelf read as one article repeated; and a dark
       photo under a dark scrim left the headline muddy. cover_image is still
       stored and still used for og:image (a photo is right for a social
       card), it just no longer paints the shelf.

       Everything on the cover now earns its place: masthead, issue number,
       one deck line, the verdict, the headline, the date. Dropped: the
       starburst seal (its text clipped to "UTPERFOR"), the fake barcode, the
       rotated photo credit up the spine, and two of the three cover-line
       blocks that were competing with the headline. */
    body.gallery .wrap{max-width:1040px}
    .news-h{margin:6px 0 26px}
    .news-title{font-family:'Literata',Georgia,serif;font-weight:600;font-size:clamp(30px,5.4vw,46px);line-height:1.05;letter-spacing:-.015em;margin:8px 0 8px}
    .news-sub{font-size:16px;color:var(--muted);max-width:60ch;margin:0}
    .covers{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:26px}
    .cover{position:relative;display:block;aspect-ratio:3/4.05;border-radius:6px;overflow:hidden;color:#fff;
      text-decoration:none;box-shadow:0 14px 34px -18px rgba(0,28,49,.55);transition:transform var(--t-fast),box-shadow var(--t-fast);isolation:isolate}
    .cover:hover{transform:translateY(-4px);box-shadow:0 26px 52px -20px rgba(0,28,49,.66)}
    .cov-art{position:absolute;inset:0;width:100%;height:100%;z-index:0}
    /* Photo thumbnail over the drawn base; multiply tint holds the series
       together and keeps white type legible on any image. */
    .cov-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;display:block}
    .cov-tint{position:absolute;inset:0;z-index:0;mix-blend-mode:multiply;opacity:.72}
    /* A single soft vignette from the foot, so the date/verdict row stays
       legible over the plotted line without greying out the whole cover. */
    .cover::before{content:"";position:absolute;inset:0;z-index:1;
      background:linear-gradient(180deg,rgba(4,10,26,.10) 0%,rgba(4,10,26,0) 34%,rgba(4,10,26,.30) 72%,rgba(4,10,26,.72) 100%)}
    .cover.featured{box-shadow:0 18px 44px -18px rgba(0,28,49,.6),0 0 0 2px rgba(20,88,125,.55)}
    .cov-in{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;padding:17px 17px 15px}
    /* Masthead — small caps, one line, never wrapping. It is the publication's
       signature, not the loudest thing on the cover; the headline is. */
    .cov-mast{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
    .cov-brand{font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;white-space:nowrap}
    .cov-no{font-size:9px;font-weight:700;letter-spacing:.1em;opacity:.7;white-space:nowrap}
    .cov-rule{height:1px;background:rgba(255,255,255,.34);margin:9px 0 0}
    /* One deck line. Three stacked callouts with coloured kickers is a
       supermarket-magazine device and it crowded the headline. */
    .cov-deck{font-size:11.5px;font-weight:600;line-height:1.4;opacity:.9;margin-top:12px;max-width:88%;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .cov-feat{margin-top:auto}
    .cov-subj{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
      opacity:.78;margin-bottom:10px}
    .cov-title{font-family:'Literata',Georgia,serif;font-weight:600;font-size:24px;line-height:1.1;letter-spacing:-.014em;
      display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
    .cover.featured .cov-title{font-size:27px}
    /* Foot — date on the left, verdict as a flat pill on the right. */
    .cov-foot{margin-top:14px;padding-top:11px;border-top:1px solid rgba(255,255,255,.28);
      display:flex;justify-content:space-between;align-items:center;gap:10px}
    .cov-date{font-size:10.5px;font-weight:700;letter-spacing:.04em;opacity:.85;white-space:nowrap}
    .cov-verd{display:inline-flex;align-items:center;gap:6px;font-size:9.5px;font-weight:800;letter-spacing:.08em;
      text-transform:uppercase;padding:4px 9px;border-radius:3px;white-space:nowrap;background:rgba(255,255,255,.14);
      border:1px solid rgba(255,255,255,.3)}
    .cov-verd .vd{width:6px;height:6px;border-radius:50%;flex:none}
    .cov-verd .tix{font-family:'Literata',Georgia,serif;font-weight:600;font-size:12.5px;letter-spacing:0;text-transform:none}
    @media(max-width:560px){
      .covers{grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:15px}
      .cov-in{padding:12px 12px 11px}
      .cov-brand{font-size:9px;letter-spacing:.18em}.cov-no{font-size:12.5px}
      .cov-deck{display:none}
      .cov-title{font-size:16px;-webkit-line-clamp:3}.cover.featured .cov-title{font-size:18px}
      .cov-foot{margin-top:10px;padding-top:8px}
      .cov-date{font-size:12.5px}.cov-verd{font-size:12.5px;padding:3px 7px}.cov-verd .tix{font-size:12.5px}
    }
    /* article hero photo */
    .hero-img{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;margin:0 0 9px;background:#eef2f8}
    .hero-img img{width:100%;height:100%;object-fit:cover;display:block}
    .hero-credit{font-size:12.5px;color:#94a3b8;margin:0 0 20px}
    .hero-credit a{color:#94a3b8;text-decoration:underline}
    .backlink{display:inline-block;font-size:13px;font-weight:600;color:var(--blue);text-decoration:none;margin:0 0 16px}
    @media(max-width:560px){
      .covers{grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:15px}
      .cov-in{padding:11px 11px 10px}
      .cov-mast{font-size:21px}.cov-mast .no{font-size:12.5px}
      .cov-title{font-size:16px}.cover.featured .cov-title{font-size:18px}
    }
  
/* ============ DIRECTION B - kinetic ============================ */
.has-js .reveal,.reveal{transition:opacity var(--t-slow) var(--e-out),
  transform var(--t-slow) var(--e-spring)}

<body>
  <header class="top">
    <div class="top-in">
      <a class="brand" href="/"><span class="mark"></span><span>TickerMover</span></a>
      <a class="cta" href="/app">Open the dashboard →</a>
    </div>
  </header>
  <main class="wrap"><div id="article"><div class="loading">📰 Loading the newsstand…</div></div></main>

  <script>
  (function(){
    // ── TickerMover coin: ink-T (rounded stroke) + the exact wordmark mountain-M
    //    with summit dot, white on the brand-blue circle. Reusable avatar. ──
    var TM_COIN = '<svg class="tm-coin" width="32" height="32" viewBox="0 0 104 104" role="img" aria-label="TickerMover"><defs><linearGradient id="tmCoinG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8FBFDD"/><stop offset=".5" stop-color="#14587D"/><stop offset="1" stop-color="#0A2F46"/></linearGradient></defs><circle cx="52" cy="52" r="51" fill="url(#tmCoinG)"/><line x1="20" y1="41" x2="42" y2="41" stroke="#fff" stroke-width="5.2" stroke-linecap="round"/><line x1="31" y1="41" x2="31" y2="71" stroke="#fff" stroke-width="5.2" stroke-linecap="round"/><g transform="translate(44.7,26) scale(0.46)"><polyline points="5,100 23,42 45,66 67,26 85,100" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="67" cy="8" r="7" fill="#fff"/></g></svg>';
    // ── Minimal, safe Markdown → HTML (headings, lists, bold/italic, links) ──
    function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function inline(s){
      s = esc(s);
      s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
      s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
      s = s.replace(/(^|[^*])\*([^*]+)\*(?!\*)/g,'$1<em>$2</em>');
      return s;
    }
    // Web-grounded Opus output wraps cited claims in <cite index="..">..</cite>
    // tags. Strip the tags (keep the cited text) so they don't render as raw
    // markup; attribution lives in the Sources list below.
    function stripCites(s){ return (s||'').replace(/<\/?cite[^>]*>/gi,''); }
    function md(text){
      const lines = stripCites(text||'').replace(/\r/g,'').split('\n');
      let html='', para=[], list=null;
      const flushP=()=>{ if(para.length){ html+='<p>'+inline(para.join(' '))+'</p>'; para=[]; } };
      const flushL=()=>{ if(list){ html+='</'+list+'>'; list=null; } };
      const isSep=(s)=>/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)+\|?\s*$/.test(s||'');
      const cells=(s)=>{ s=s.trim().replace(/^\|/,'').replace(/\|$/,''); return s.split('|').map(c=>c.trim()); };
      for(let i=0;i<lines.length;i++){
        const raw=lines[i], line=raw.trimEnd();
        // GFM pipe table: a header row with pipes, immediately followed by a --- separator
        if(/\|/.test(line) && isSep(lines[i+1])){
          flushP(); flushL();
          const head=cells(line); i+=2; let rows='';
          while(i<lines.length && lines[i].indexOf('|')>=0 && lines[i].trim()!==''){
            rows+='<tr>'+cells(lines[i]).map(x=>'<td>'+inline(x)+'</td>').join('')+'</tr>'; i++;
          }
          i--;
          html+='<div class="tablewrap"><table><thead><tr>'+head.map(x=>'<th>'+inline(x)+'</th>').join('')+'</tr></thead><tbody>'+rows+'</tbody></table></div>';
          continue;
        }
        // Callout block:  :::note|warn|good  Title
        //                  ...body markdown...
        //                  :::
        var mCall=/^:::\s*(note|warn|good)?\s*(.*)$/.exec(line);
        if(mCall && line.indexOf(':::')===0 && !/^:::\s*$/.test(line)){
          flushP(); flushL();
          var kind=mCall[1]||'note', ctitle=mCall[2]||'', inner=[];
          i++;
          while(i<lines.length && !/^:::\s*$/.test(lines[i].trim())){ inner.push(lines[i]); i++; }
          var ICON={note:'\u{1F4A1}',warn:'\u26A0',good:'\u2713'};
          html+='<aside class="callout '+(kind==='note'?'':kind)+'">'+
                '<span class="callout-badge">'+(ICON[kind]||ICON.note)+'</span>'+
                (ctitle?'<h4>'+inline(ctitle)+'</h4>':'')+ md(inner.join('\n')) +'</aside>';
          continue;
        }
        if(/^###\s+/.test(line)){ flushP(); flushL(); html+='<h3>'+inline(line.replace(/^###\s+/,''))+'</h3>'; continue; }
        if(/^##\s+/.test(line)){ flushP(); flushL(); html+='<h2>'+inline(line.replace(/^##\s+/,''))+'</h2>'; continue; }
        if(/^#\s+/.test(line)){ flushP(); flushL(); html+='<h2>'+inline(line.replace(/^#\s+/,''))+'</h2>'; continue; }
        if(/^[-*]\s+/.test(line)){ flushP(); if(list!=='ul'){flushL();html+='<ul>';list='ul';} html+='<li>'+inline(line.replace(/^[-*]\s+/,''))+'</li>'; continue; }
        if(/^\d+\.\s+/.test(line)){ flushP(); if(list!=='ol'){flushL();html+='<ol>';list='ol';} html+='<li>'+inline(line.replace(/^\d+\.\s+/,''))+'</li>'; continue; }
        if(line===''){ flushP(); flushL(); continue; }
        if(list) flushL();
        para.push(line);
      }
      flushP(); flushL();
      return html;
    }

    // A donut for share-of-a-whole data. Categorical hues in FIXED order (never
    // cycled beyond the ramp); legend labels carry identity so it is never
    // colour-alone. Center shows the largest slice.
    var DN_PAL=['#14587D','#12b3a6','#f59e0b','#9b5de5','#64748b','#0ea5e9'];
    function donutHtml(ch){
      var segs=(ch.bars||[]).filter(function(b){return b&&isFinite(+b.value)&&+b.value>0;});
      if(!segs.length) return '';
      var total=0,i; for(i=0;i<segs.length;i++) total+=+segs[i].value; if(total<=0) return '';
      var cx=70,cy=70,r=54,C=2*Math.PI*r, cum=0, ring='', leg='', big={v:-1,pct:0,label:''};
      for(i=0;i<segs.length;i++){
        var v=+segs[i].value, frac=v/total, col=DN_PAL[i%DN_PAL.length], pct=Math.round(frac*100);
        var dash=Math.max(0,frac*C-2);
        ring+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="26" '+
              'stroke-dasharray="'+dash.toFixed(2)+' '+(C-dash).toFixed(2)+'" stroke-dashoffset="'+(-cum*C).toFixed(2)+'"/>';
        leg+='<div class="dn-li"><span class="dn-dot" style="background:'+col+'"></span>'+esc(String(segs[i].label||''))+'<b>'+pct+'%</b></div>';
        if(v>big.v){ big={v:v,pct:pct,label:String(segs[i].label||'')}; }
        cum+=frac;
      }
      var svg='<svg class="dn-svg" width="140" height="140" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg" role="img">'+
        '<g transform="rotate(-90 70 70)">'+ring+'</g>'+
        '<text x="70" y="67" text-anchor="middle" font-family="Literata,Georgia,serif" font-weight="600" font-size="27" fill="#0A2F46">'+big.pct+'%</text>'+
        '<text x="70" y="85" text-anchor="middle" font-size="9.5" font-weight="700" letter-spacing=".04em" fill="#64748b">'+esc(big.label.slice(0,11).toUpperCase())+'</text></svg>';
      return '<div class="chart"><div class="ch-h">'+esc(ch.title||'Share of the whole')+'</div>'+
        '<div class="dn-wrap">'+svg+'<div class="dn-leg">'+leg+'</div></div>'+
        (ch.note?'<p class="ch-note">'+esc(stripCites(ch.note))+'</p>':'')+'</div>';
    }
    // Render the `charts` array: horizontal bars (magnitude / signed moves; scaled
    // to max ABS value so negatives read red) or a donut (type:"donut").
    // Shared: display a value with the chart's unit.
    function chVal(v,unit){
      return (unit==='%') ? ((v>0?'+':'')+v+'%') : (unit==='$') ? ('$'+v) : String(v);
    }
    function chShell(ch,inner){
      var unit=(ch.unit||'').trim();
      return '<div class="chart"><div class="ch-h">'+esc(ch.title||'By the numbers')+
        (unit?'<span class="ch-unit">'+esc(unit==='%'?'% change':unit==='$'?'USD':unit)+'</span>':'')+'</div>'+
        inner+(ch.note?'<p class="ch-note">'+esc(stripCites(ch.note))+'</p>':'')+'</div>';
    }
    // LINE — a trend through ordered periods. Drawn in a fixed 600x172 viewBox
    // and scaled by CSS, so it stays crisp at any column width without a lib.
    function lineHtml(ch,bars){
      var n=bars.length; if(n<2) return '';
      var unit=(ch.unit||'').trim();
      var vals=bars.map(function(b){return +b.value;});
      var lo=Math.min.apply(null,vals), hi=Math.max.apply(null,vals);
      if(lo>0) lo=0; if(hi<0) hi=0;                 // always show the zero line
      if(hi===lo) hi=lo+1;
      var W=600,H=172,padX=34,padT=26,padB=34;
      var x=function(i){ return padX+i*(W-2*padX)/(n-1); };
      var y=function(v){ return padT+(hi-v)/(hi-lo)*(H-padT-padB); };
      var pts=bars.map(function(b,i){ return x(i)+','+y(+b.value); });
      var zero=y(0);
      var dots='',labs='';
      for(var i=0;i<n;i++){
        var b=bars[i], v=+b.value;
        dots+='<circle class="ln-dot'+(b.hi?' hi':'')+'" cx="'+x(i)+'" cy="'+y(v)+'" r="4"/>';
        labs+='<text class="ln-lab" x="'+x(i)+'" y="'+(H-12)+'" text-anchor="middle">'+esc(String(b.label||''))+'</text>';
        if(b.hi||i===n-1) labs+='<text class="ln-v" x="'+x(i)+'" y="'+(y(v)-11)+'" text-anchor="middle">'+esc(chVal(v,unit))+'</text>';
      }
      return chShell(ch,'<svg class="ch-line" viewBox="0 0 '+W+' '+H+'" role="img">'+
        '<line class="ln-zero" x1="'+padX+'" y1="'+zero+'" x2="'+(W-padX)+'" y2="'+zero+'"/>'+
        '<polyline class="ln-path" points="'+pts.join(' ')+'"/>'+dots+labs+'</svg>');
    }
    // WATERFALL — a change decomposed into contributions. Bars float: each one
    // starts where the running total left off, so the reader sees it accumulate.
    function waterfallHtml(ch,bars){
      var unit=(ch.unit||'').trim(), cum=0, segs=[];
      for(var i=0;i<bars.length;i++){
        var d=+bars[i].value, a=cum, b2=cum+d; cum=b2;
        segs.push({lab:bars[i].label,val:d,hi:!!bars[i].hi,lo:Math.min(a,b2),up:Math.max(a,b2)});
      }
      var minB=0,maxT=0;
      for(var j=0;j<segs.length;j++){ if(segs[j].lo<minB) minB=segs[j].lo; if(segs[j].up>maxT) maxT=segs[j].up; }
      var range=(maxT-minB)||1, cols='';
      for(var k=0;k<segs.length;k++){
        var s=segs[k];
        var hPct=Math.max(2,(s.up-s.lo)/range*100), offPct=(s.lo-minB)/range*100;
        cols+='<div class="wf-col"><span class="wf-v">'+esc(chVal(s.val,unit))+'</span>'+
              '<span class="wf-bar'+(s.val<0?' neg':'')+(s.hi?' hi':'')+
              '" style="height:'+hPct.toFixed(1)+'%;margin-bottom:'+offPct.toFixed(1)+'%"></span>'+
              '<span class="wf-l">'+esc(String(s.lab||''))+'</span></div>';
      }
      return chShell(ch,'<div class="ch-wf">'+cols+'</div>');
    }
    // GROUPED — two comparable series per item (this week vs last, us vs index).
    function groupedHtml(ch,bars){
      var unit=(ch.unit||'').trim(), max=0;
      for(var i=0;i<bars.length;i++){
        var a=Math.abs(+bars[i].value); if(a>max) max=a;
        var b2=Math.abs(+bars[i].value2); if(isFinite(b2)&&b2>max) max=b2;
      }
      if(max<=0) max=1;
      var s1=(ch.series&&ch.series[0])||'Series 1', s2=(ch.series&&ch.series[1])||'Series 2';
      var key='<div class="ch-key"><span><i style="background:#14587D"></i>'+esc(s1)+'</span>'+
              '<span><i style="background:#94a3b8"></i>'+esc(s2)+'</span></div>';
      var rows='';
      for(var k=0;k<bars.length;k++){
        var b=bars[k], v1=+b.value, v2=+b.value2;
        var w1=Math.max(3,Math.round(Math.abs(v1)/max*100));
        var t='<span class="gr-t"><span class="gr-f'+(v1<0?' neg':'')+'" style="width:'+w1+'%"></span></span>';
        if(isFinite(v2)){
          var w2=Math.max(3,Math.round(Math.abs(v2)/max*100));
          t+='<span class="gr-t"><span class="gr-f s2'+(v2<0?' neg':'')+'" style="width:'+w2+'%"></span></span>';
        }
        rows+='<div class="ch-row"><span class="ch-lab">'+esc(String(b.label||''))+'</span>'+
              '<span>'+t+'</span><span class="ch-val">'+esc(chVal(v1,unit))+'</span></div>';
      }
      return chShell(ch,key+rows);
    }
    // GAUGE — one 0-100 reading as a half-dial (an Quant Score).
    function gaugeHtml(ch,bars){
      var b=bars[0]||{}, v=Math.max(0,Math.min(100,+b.value||0));
      var R=60,CX=76,CY=76, len=Math.PI*R;
      var col = v>=70?'#16a34a' : v>=50?'#14587D' : v>=35?'#f59e0b' : '#dc2626';
      var svg='<svg class="gg-svg" viewBox="0 0 152 90" role="img">'+
        '<path class="gg-track" d="M '+(CX-R)+' '+CY+' A '+R+' '+R+' 0 0 1 '+(CX+R)+' '+CY+'"/>'+
        '<path class="gg-fill" d="M '+(CX-R)+' '+CY+' A '+R+' '+R+' 0 0 1 '+(CX+R)+' '+CY+'" stroke="'+col+'"'+
        ' stroke-dasharray="'+len.toFixed(1)+'" stroke-dashoffset="'+(len*(1-v/100)).toFixed(1)+'"/></svg>';
      return chShell(ch,'<div class="ch-gauge">'+svg+
        '<div><div class="gg-read" style="color:'+col+'">'+esc(String(b.value))+'</div>'+
        '<div class="gg-lab">'+esc(String(b.label||''))+'</div></div></div>');
    }
    function chartsHtml(charts){
      if(!Array.isArray(charts) || !charts.length) return '';
      var out='';
      for(var c=0;c<charts.length;c++){
        var ch=charts[c]||{};
        if((ch.type||'')==='donut'){ out+=donutHtml(ch); continue; }
        var _b=Array.isArray(ch.bars)?ch.bars.filter(function(b){return b&&isFinite(+b.value);}):[];
        if(_b.length){
          var _t=ch.type||'';
          // Each renderer returns '' when the shape it needs isn't there, so a
          // thin series falls through to the bar chart rather than vanishing.
          var alt='';
          if(_t==='line')           alt=lineHtml(ch,_b);
          else if(_t==='waterfall') alt=waterfallHtml(ch,_b);
          else if(_t==='grouped')   alt=groupedHtml(ch,_b);
          else if(_t==='gauge')     alt=gaugeHtml(ch,_b);
          if(alt){ out+=alt; continue; }
        }
        var bars=Array.isArray(ch.bars)?ch.bars.filter(function(b){return b&&isFinite(+b.value);}):[];
        if(!bars.length) continue;
        var unit=(ch.unit||'').trim(), max=0;
        for(var j=0;j<bars.length;j++){ var a=Math.abs(+bars[j].value); if(a>max) max=a; }
        if(max<=0) max=1;
        var rows='';
        for(var k=0;k<bars.length;k++){
          var b=bars[k], v=+b.value, w=Math.max(3,Math.round(Math.abs(v)/max*100));
          var cls='ch-fill'+(b.hi?' hi':'')+(v<0?' neg':'');
          var disp=(unit==='%')?( (v>0?'+':'')+v+'%' ):(unit==='$')?('$'+v):String(v);
          rows+='<div class="ch-row"><span class="ch-lab">'+esc(String(b.label||''))+'</span>'+
                '<span class="ch-track"><span class="'+cls+'" style="width:'+w+'%"></span></span>'+
                '<span class="ch-val">'+esc(disp)+'</span></div>';
        }
        out+='<div class="chart"><div class="ch-h">'+esc(ch.title||'By the numbers')+
             (unit?'<span class="ch-unit">'+esc(unit==='%'?'% change':unit==='$'?'USD':unit)+'</span>':'')+'</div>'+
             rows+(ch.note?'<p class="ch-note">'+esc(stripCites(ch.note))+'</p>':'')+'</div>';
      }
      return out?'<div class="charts">'+out+'</div>':'';
    }
    // Blinkit-style hero numbers under the standfirst — the headline figures.
    function statTiles(tiles){
      if(!Array.isArray(tiles)||!tiles.length) return '';
      var AR={up:'▲',down:'▼',flat:'—'};
      var out=tiles.slice(0,4).map(function(t){
        var dir=String(t.dir||'flat').toLowerCase(); if(!AR[dir]) dir='flat';
        return '<div class="stat"><div class="stat-v">'+esc(String(t.value||''))+
          '<span class="ar '+dir+'">'+AR[dir]+'</span></div>'+
          '<div class="stat-l">'+esc(String(t.label||''))+'</div>'+
          (t.sub?'<div class="stat-s">'+esc(stripCites(t.sub))+'</div>':'')+'</div>';
      }).join('');
      return '<div class="stats">'+out+'</div>';
    }
    // Bear / Base / Bull scenario cards — status colours WITH a labelled case, never colour-alone.
    function scenarioCards(sc){
      if(!Array.isArray(sc)||!sc.length) return '';
      var COL={bear:'#dc2626',base:'#64748b',bull:'#16a34a'}, ORD={bear:0,base:1,bull:2};
      var arr=sc.slice(0,3).slice().sort(function(a,b){
        return (ORD[String(a.case||'').toLowerCase()]==null?9:ORD[String(a.case||'').toLowerCase()])
             - (ORD[String(b.case||'').toLowerCase()]==null?9:ORD[String(b.case||'').toLowerCase()]); });
      var cards=arr.map(function(s){
        var col=COL[String(s.case||'').toLowerCase()]||'#94a3b8';
        return '<div class="scenc" style="--sccol:'+col+'">'+
          '<div class="scen-top"><span class="scen-case">'+esc(String(s.case||''))+'</span>'+
          (s.prob?'<span class="scen-prob">'+esc(String(s.prob))+'</span>':'')+'</div>'+
          (s.thesis?'<p class="scen-thesis">'+esc(stripCites(s.thesis))+'</p>':'')+
          (s.trigger?'<div class="scen-trig"><b>Trigger:</b> '+esc(stripCites(s.trigger))+'</div>':'')+'</div>';
      }).join('');
      return '<div class="scen-h">Bear · Base · Bull — our scenario map</div><div class="scen">'+cards+'</div>';
    }

    // "The Week" spread: `engine` = our own book moving (proprietary),
    // `market` = what happened out there. Rendered as two facing pages.
    function weekUpdatesHtml(wu, which){
      if(!wu) return '';
      var items=(which==='engine'? wu.engine : wu.market)||[];
      if(!Array.isArray(items)||!items.length) return '';
      var KC={entry:'#16a34a',exit:'#dc2626',book:'#14587D'};
      var out=items.slice(0,6).map(function(it){
        var kind=String(it.kind||'book').toLowerCase();
        var col = which==='engine' ? (KC[kind]||'#14587D') : '#0ea5e9';
        var label = which==='engine'
          ? (kind==='entry'?'New entry':kind==='exit'?'Exit':'Book')
          : (it.tag||'Market');
        return '<div class="wk-item" style="--wkc:'+col+'">'+
          '<div class="wk-top"><span class="wk-kind">'+esc(label)+'</span>'+
            (it.ticker?'<span class="wk-tix">'+esc(it.ticker)+'</span>':'')+
            (it.metric?'<span class="wk-metric">'+esc(it.metric)+'</span>':'')+'</div>'+
          '<div class="wk-head">'+esc(stripCites(it.headline||''))+'</div>'+
          (it.detail?'<div class="wk-detail">'+esc(stripCites(it.detail))+'</div>':'')+
        '</div>';
      }).join('');
      return '<div class="wk">'+out+'</div>';
    }
    // Paginate the feature on its ## headings — one section per page.
    function splitSections(t){
      return stripCites(t||'').replace(/\r/g,'').split(/\n(?=##\s)/).filter(function(p){return p.trim();});
    }
    // Page 1 IS the magazine cover — the same designed cover as the newsstand,
    // full-bleed. The vector art is ALWAYS the base layer, so the headline stays
    // legible whether or not a photo is present (fixes the blank-cover case).
    function bookCover(d){
      var seed=d.week_start||d.title||'x', g=coverGrad(seed);
      var subj=d.subject||'';
      var no=issueNo(d.week_start);
      // Same designed cover as the newsstand, full-bleed. No photo layer: the
      // shelf and the issue must look like the same publication, and the
      // stock photo was the reason the shelf looked repetitive.
      return '<section class="page cover-pg" style="background:linear-gradient(155deg,'+g[0]+' 0%,'+g[1]+' 100%)">'+
        coverArt(seed)+
        '<div class="cov-in bookcov">'+
          '<div class="cov-mast"><span class="cov-brand">Market Movers</span>'+
            '<span class="cov-no">'+(no?'No. '+no:'')+'</span></div>'+
          '<div class="cov-rule"></div>'+
          '<div class="cov-feat">'+(subj?'<div class="cov-subj">'+esc(subj)+'</div>':'')+
            '<div class="cov-title">'+esc(stripCites(d.title||''))+'</div>'+
            (d.standfirst?'<p class="bookcov-stand">'+esc(stripCites(d.standfirst))+'</p>':'')+
          '</div>'+
          '<div class="cov-foot"><span class="cov-date">'+esc(d.week_label?('Week of '+d.week_label):'')+'</span>'+
            verdictPill(d.cover_splash)+'</div>'+
        '</div></section>';
    }
    function buildPages(d){
      var pages=[];
      // The hero photo already opens the article, so the full-bleed drawn cover
      // straight underneath meant two large images stacked before a word of
      // prose. The cover still does its job on the newsstand.
      // pages.push(bookCover(d));
      pages.push('<section class="page"><div class="pg-num">The bottom line</div>'+
        (d.house_view?'<div class="bottomline"><div class="h">⚖️ Bottom line</div><div class="t">'+esc(stripCites(d.house_view))+'</div></div>':'')+
        statTiles(d.stat_tiles)+'</section>');
      var eng=weekUpdatesHtml(d.week_updates,'engine'), mkt=weekUpdatesHtml(d.week_updates,'market');
      if(eng) pages.push('<section class="page"><div class="pg-num">The week · from our desk</div>'+
        '<div class="pg-h">What our engine did</div>'+eng+'</section>');
      if(mkt) pages.push('<section class="page"><div class="pg-num">The week · in the market</div>'+
        '<div class="pg-h">What moved</div>'+mkt+'</section>');
      var secs=splitSections(d.body_markdown);
      for(var i=0;i<secs.length;i++){
        pages.push('<section class="page"><div class="pg-num">The feature'+(secs.length>1?' · '+(i+1)+'/'+secs.length:'')+'</div>'+
          '<div class="article'+(i===0?' lead':'')+'">'+md(secs[i])+'</div></section>');
      }
      var ch=chartsHtml(d.charts);
      if(ch) pages.push('<section class="page"><div class="pg-num">By the numbers</div>'+ch+'</section>');
      var sc=scenarioCards(d.scenarios);
      if(sc) pages.push('<section class="page"><div class="pg-num">Scenarios</div>'+sc+'</section>');
      var sources=(d.sources||[]).map(function(s){
        return '<a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.title||s.url)+' ↗</a>';
      }).join('');
      pages.push('<section class="page"><div class="pg-num">Endnotes</div>'+
        (d.pull_quote?'<div class="pull">“'+esc(stripCites(d.pull_quote))+'”</div>':'')+
        (sources?'<div class="sources"><div class="h">Sources</div>'+sources+'</div>':'')+
        '<div class="disc">TickerMover\'s editorial opinion, framed on our own Bullish/Cautious view basis — for information, education and market awareness only, not investment advice, not a personal recommendation, and not FCA-authorised. Figures from our models and cited sources. Capital at risk; past performance is not a guide to future results. Do your own research.</div>'+
      '</section>');
      return pages;
    }
    function wireBook(){
      var bk=document.getElementById('book'); if(!bk) return;
      var pages=[].slice.call(bk.querySelectorAll('.page'));
      var prev=document.getElementById('bkPrev'), next=document.getElementById('bkNext'),
          ind=document.getElementById('bkInd'), dots=document.getElementById('bkDots'),
          tog=document.getElementById('bkToggle');
      var base=pages.length?pages[0].offsetLeft:0;
      function perView(){ return bk.clientWidth>=900?2:1; }
      function curIdx(){
        var best=0,bd=Infinity;
        pages.forEach(function(p,i){ var dd=Math.abs((p.offsetLeft-base)-bk.scrollLeft); if(dd<bd){bd=dd;best=i;} });
        return best;
      }
      var RM = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)');
      function go(i){
        i=Math.max(0,Math.min(pages.length-1,i));
        bk.scrollTo({left:pages[i].offsetLeft-base, behavior:(RM&&RM.matches)?'auto':'smooth'});
      }
      dots.innerHTML=pages.map(function(_,i){return '<button class="bk-dot" type="button" aria-label="Go to page '+(i+1)+'"></button>';}).join('');
      [].forEach.call(dots.children,function(b,i){ b.onclick=function(){ go(i); }; });
      function update(){
        var i=curIdx();
        ind.textContent=(i+1)+' / '+pages.length;
        prev.disabled = bk.scrollLeft<=2;
        next.disabled = bk.scrollLeft>=bk.scrollWidth-bk.clientWidth-2;
        [].forEach.call(dots.children,function(b,k){ b.classList.toggle('on',k===i); });
      }
      prev.onclick=function(){ go(curIdx()-perView()); };
      next.onclick=function(){ go(curIdx()+perView()); };
      bk.addEventListener('scroll',function(){ clearTimeout(bk._t); bk._t=setTimeout(update,60); });
      bk.addEventListener('keydown',function(e){
        if(e.key==='ArrowRight'){ e.preventDefault(); go(curIdx()+perView()); }
        else if(e.key==='ArrowLeft'){ e.preventDefault(); go(curIdx()-perView()); }
      });
      window.addEventListener('resize',function(){ base=pages.length?pages[0].offsetLeft:0; update(); });
      tog.onclick=function(){
        var lin=document.body.classList.toggle('scroll-view');
        tog.textContent = lin ? '📖 Book view' : '📜 Scroll view';
        if(!lin) update();
      };
      update();
    }

    function render(d){

      }).join('');
      var when=[d.week_label?('Week of '+esc(d.week_label)):'', d.published_at?('· '+esc(d.published_at)):''].filter(Boolean).join(' ');
      var _rwk=parseWeek();
      // Canonicalise ?week= (and bare paths) to the pretty permalink so shares/
      // copy-link use the SEO URL. History-only; no network, no reload.
      try{
        if(d.week_start){
          var pretty='/weekly/'+d.week_start+'/'+(d.slug||slugify(d.title||d.subject||'issue'));
          if(location.pathname+location.search!==pretty) history.replaceState(null,'',pretty);

      var hero = (img&&img.url)
        ? '<figure class="issue-hero"><img src="'+esc(img.url)+'" alt="'+esc(img.alt||d.subject||'')+'">'+
          (d.subject?'<figcaption class="cap">'+esc(d.subject)+'</figcaption>':'')+'</figure>'+
          (img.credit_name?'<p class="issue-cred">Photo · <a href="'+esc(img.credit_url||'#')+
            '" target="_blank" rel="noopener nofollow">'+esc(img.credit_name)+'</a> / '+esc(img.source||'Unsplash')+'</p>':'')
        : '';
      var keybox = d.house_view
        ? '<div class="keybox"><h4>The house view</h4><p>'+esc(stripCites(d.house_view))+'</p></div>' : '';
      root.innerHTML =
        (_rwk?'<a class="backlink" href="/weekly">← All issues</a>':'')+
        '<div class="issue-grid">'+
          '<aside class="rail"><div class="rail-h">In this issue</div>'+
            '<ul class="rail-toc" id="railToc"></ul>'+
            '<div class="rail-cta"><b>See the scores behind this issue</b>'+
              '<p>Every name here is scored daily on six pillars in the dashboard.</p>'+
              '<a href="/app">Open the dashboard →</a></div>'+
          '</aside>'+
          '<div class="issue-main">'+
            '<div class="eyebrow">From the desk · Market Movers</div>'+
            '<h1 class="issue-h1">'+esc(stripCites(d.title||''))+'</h1>'+
            (d.standfirst?'<p class="issue-stand">'+esc(stripCites(d.standfirst))+'</p>':'')+
            '<div class="byline">'+TM_COIN+'<b>'+esc(d.byline||'TickerMover Desk')+'</b> · '+when+'</div>'+
            shareBar()+
            (tickers?'<div class="chips">'+tickers+'</div>':'')+

      if(d.title) document.title=d.title+' — TickerMover';

    // Contents rail, built from the rendered <h2>s (never from stored metadata,
    // which can drift from the prose). Scroll-spy highlights the current one.
    function buildRail(){
      var toc=document.getElementById('railToc'); if(!toc) return;
      var hs=[].slice.call(document.querySelectorAll('.issue-main .book h2'));
      if(!hs.length){ var r=toc.parentNode; if(r) r.style.display='none'; return; }
      toc.innerHTML=hs.map(function(h,i){
        if(!h.id) h.id='sec-'+i;
        return '<li><a href="#'+h.id+'" data-i="'+i+'"><span class="n">'+(i+1)+'</span>'+
               esc(h.textContent.trim())+'</a></li>';
      }).join('');
      var links=[].slice.call(toc.querySelectorAll('a'));
      links.forEach(function(a){
        a.addEventListener('click',function(ev){
          ev.preventDefault();
          var t=document.getElementById(a.getAttribute('href').slice(1));
          if(t) window.scrollTo({top:t.getBoundingClientRect().top+window.pageYOffset-18,behavior:'smooth'});
        });
      });
      if(!('IntersectionObserver' in window)) return;
      var io=new IntersectionObserver(function(en){
        en.forEach(function(e){
          if(!e.isIntersecting) return;
          var i=hs.indexOf(e.target);
          links.forEach(function(a,k){ a.classList.toggle('on',k===i); });
        });
      },{rootMargin:'-10% 0px -70% 0px'});
      hs.forEach(function(h){ io.observe(h); });
    }
    // SEO-friendly issue URLs: /weekly/<YYYY-MM-DD>/<slug>. The date is the key;
    // the slug is human/search-readable. Old ?week= links still resolve.
    var _STOP={the:1,a:1,an:1,is:1,are:1,of:1,to:1,in:1,on:1,for:1,and:1,or:1,its:1,at:1,by:1,'as':1,'with':1,that:1,'this':1,has:1,was:1,market:1,s:1};
    function slugify(t){
      var words=String(t||'').toLowerCase().replace(/[^a-z0-9\s-]/g,' ').split(/[\s-]+/).filter(function(w){return w&&!_STOP[w];});
      return (words.slice(0,7).join('-')||'issue').slice(0,80).replace(/^-+|-+$/g,'');
    }
    function weeklyHref(e){
      var wk=(e&&e.week_start)||''; if(!wk) return '/weekly';
      return '/weekly/'+encodeURIComponent(wk)+'/'+(e.slug||slugify(e.title||e.subject||'issue'));
    }
    function parseWeek(){
      var m=location.pathname.match(/^\/weekly\/(\d{4}-\d{2}-\d{2})/);
      if(m) return m[1];
      return (new URLSearchParams(location.search).get('week')||'').trim();
    }
    // Deterministic magazine-cover gradient per issue (no images, no AI cost).
    function coverGrad(seed){
      var pals=[['#0b3d91','#14587D'],['#0b5d5a','#12b3a6'],['#4c2a86','#9b5de5'],['#1f3a24','#3f9d55'],['#3a2f22','#a8743a'],['#1e293b','#51607a'],['#5c1a2b','#b23a52'],['#123a52','#2b8cbe']];
      var h=0, s=String(seed||''); for(var i=0;i<s.length;i++){ h=((h*31)+s.charCodeAt(i))>>>0; }
      return pals[h%pals.length];
    }
    // Seeded PRNG so each issue's cover art is stable but distinct.
    function seededRand(seed){
      var h=1779033703 ^ seed.length;
      for(var i=0;i<seed.length;i++){ h=Math.imul(h ^ seed.charCodeAt(i),3432918353); h=(h<<13)|(h>>>19); }
      return function(){ h=Math.imul(h ^ (h>>>16),2246822507); h=Math.imul(h ^ (h>>>13),3266489909); h^=h>>>16; return (h>>>0)/4294967296; };
    }
    // Market-themed cover art: faint grid + volume bars + a rising price path
    // with area fill and node dots — vector, colored by the cover gradient.
    // The cover motif: a plotted line over a faint grid. It is the only
    // ornament left, and it is the one that actually says "research desk".
    // Dropped from the old version: the 200px ghost initial and the random
    // background bars, which fought the headline for the same space.
    function coverArt(seed){
      var rnd=seededRand(String(seed||'x')), W=300,H=405,n=9,step=W/(n-1),pts=[],y=H*0.62,i;
      for(i=0;i<n;i++){
        y+=(rnd()-0.5)*H*0.11; y-=(i/(n-1))*H*0.16;
        y=Math.max(H*0.30,Math.min(H*0.70,y));
        pts.push([Math.round(i*step),Math.round(y)]);
      }
      var line='M '+pts.map(function(p){return p[0]+' '+p[1];}).join(' L ');
      var area=line+' L '+W+' '+H+' L 0 '+H+' Z';
      var dots=pts.map(function(p,k){
        return k===n-1
          ? '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="#fff" fill-opacity=".95"/>'
          : '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="2.2" fill="#fff" fill-opacity=".5"/>';
      }).join('');
      var grid='';
      for(var g=1;g<8;g++){ var gy=Math.round(H*g/8);
        grid+='<line x1="0" y1="'+gy+'" x2="'+W+'" y2="'+gy+'" stroke="#fff" stroke-opacity=".05"/>'; }
      for(var v=1;v<6;v++){ var gx=Math.round(W*v/6);
        grid+='<line x1="'+gx+'" y1="0" x2="'+gx+'" y2="'+H+'" stroke="#fff" stroke-opacity=".035"/>'; }
      return '<svg class="cov-art" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'+
        grid+'<path d="'+area+'" fill="#fff" fill-opacity=".06"/>'+
        '<path d="'+line+'" fill="none" stroke="#fff" stroke-opacity=".72" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
        dots+'</svg>';
    }
    // Verdict as a flat pill with a status dot — never colour alone, and never
    // the old starburst seal, whose fixed 74px circle clipped "Outperform" to
    // "UTPERFOR" on every cover that carried one.
    function verdictPill(sp){
      if(!sp||!sp.ticker) return '';
      var v=String(sp.verdict||'Watch'), k=v.toLowerCase();
      var dot=k.indexOf('out')>=0?'#4ade80':k.indexOf('avoid')>=0?'#f87171':'#fbbf24';
      return '<span class="cov-verd"><span class="vd" style="background:'+dot+'"></span>'+
             '<span class="tix">'+esc(sp.ticker)+'</span>'+esc(v)+'</span>';
    }
    // Stable, increasing issue number from the ISO Monday (weeks since 29 Dec 2025).
    function issueNo(ws){
      try{ var d=new Date(String(ws)+'T00:00:00Z'); if(isNaN(d)) return null;
        var n=Math.round((d.getTime()-Date.UTC(2025,11,29))/6048e5); return n>0?n:null; }
      catch(e){ return null; }
    }
    function coverCard(e,i,featured){
      var seed=e.week_start||e.title||('i'+i);
      var g=coverGrad(seed);
      var no=issueNo(e.week_start);
      var subj=e.subject||'';
      // One deck line: the standfirst if we have it, else the first cover line.
      var deck=stripCites(e.standfirst||(e.cover_lines||[])[0]||'');
      // The stock photo is the thumbnail; the drawn chart sits underneath so a
      // blocked or 404 image still shows a designed cover rather than a slab of
      // flat colour. The tint keeps five different photos reading as one series.
      var img=e.cover_image||null;
      var photo = (img&&(img.thumb||img.url))
        ? '<img class="cov-photo" src="'+esc(img.thumb||img.url)+'" alt="'+esc(img.alt||subj||'')+'" loading="lazy">'+
          '<div class="cov-tint" style="background:linear-gradient(155deg,'+g[0]+' 0%,'+g[1]+' 100%)"></div>'
        : '';
      return '<a class="cover'+(featured?' featured':'')+'" href="'+weeklyHref(e)+
        '" style="background:linear-gradient(155deg,'+g[0]+' 0%,'+g[1]+' 100%)">'+
        coverArt(seed)+photo+
        '<div class="cov-in">'+
          '<div class="cov-mast"><span class="cov-brand">Market Movers</span>'+
            '<span class="cov-no">'+(no?'No. '+no:'')+(i===0?' · Latest':'')+'</span></div>'+
          '<div class="cov-rule"></div>'+
          (deck?'<div class="cov-deck">'+esc(deck)+'</div>':'')+
          '<div class="cov-feat">'+
            (subj?'<div class="cov-subj">'+esc(subj)+'</div>':'')+
            '<div class="cov-title">'+esc(stripCites(e.title||subj||'Untitled issue'))+'</div>'+
          '</div>'+
          '<div class="cov-foot"><span class="cov-date">'+esc(e.week_label||e.week_start||'')+'</span>'+
            verdictPill(e.cover_splash)+'</div>'+
        '</div>'+
      '</a>';
    }
    function renderGallery(d){
      var root=document.getElementById('article');
      var eds=(d&&d.editions)||[];
      document.body.classList.add('gallery');
      if(!eds.length){ root.innerHTML='<div class="empty">📰 The first weekly issue is on its way. Check back soon.</div>'; return; }
      var head='<div class="news-h"><div class="eyebrow">From the desk</div>'+
        '<h1 class="news-title">Market Movers</h1>'+
        '<p class="news-sub">TickerMover\'s signed weekly stock-market analysis — one deep, data-grounded issue a week on the sectors and stocks that are moving. Pick an issue to read.</p></div>';
      var covers=eds.map(function(e,i){ return coverCard(e,i, i===0); }).join('');
      root.innerHTML=head+'<div class="covers">'+covers+'</div>';
      // The cover-photo error handler that lived here is gone with the photos
      // themselves — covers are drawn now, so there is nothing left to fail.
      document.title='Market Movers — Weekly Stock Market Analysis | TickerMover';
    }

    var _wk=parseWeek();
    if(_wk){
      fetch('/api/weekly-editorial?week='+encodeURIComponent(_wk))
        .then(function(r){return r.json();}).then(render).catch(function(){
          document.getElementById('article').innerHTML='<div class="empty">Could not load this issue. Please try again shortly.</div>';
        });
    } else {
      fetch('/api/weekly-editorials').then(function(r){return r.json();}).then(renderGallery).catch(function(){
        // fallback: if the index fails, drop back to the latest article
        fetch('/api/weekly-editorial').then(function(r){return r.json();}).then(render).catch(function(){
          document.getElementById('article').innerHTML='<div class="empty">Could not load the newsstand. Please try again shortly.</div>';
        });
      });
    }
  })();
  </script>
</body>
</html>
