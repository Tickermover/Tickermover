<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Market Movers — Weekly Stock Market Analysis &amp; Stocks to Watch | TickerMover</title>
  <meta name="description" content="TickerMover's signed weekly editorial — a long-form, data-grounded deep-dive into the week's most important sector or stock, written by our desk.">
  <link rel="icon" type="image/svg+xml" href="/static/brand/tickermover-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500;1,9..144,600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--blue:#2970ff;--ink:#0f172a;--muted:#475569}
    *{box-sizing:border-box}
    body{margin:0;background:#fcfbf9;color:var(--ink);
      font-family:'Instrument Sans',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.6}
    a{color:var(--blue)}
    .top{position:sticky;top:0;z-index:20;background:rgba(252,251,249,.86);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid rgba(15,23,42,.07)}
    .top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px}
    .brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:600;font-size:19px;letter-spacing:-.022em;color:#0a0a0a}
    .brand .mark{width:30px;height:30px;flex:none;background:linear-gradient(135deg,#5DB3F1 0%,#2970FF 50%,#0040c1 100%);
      -webkit-mask:url('/static/brand/tickermover-mark-mask.svg') center/contain no-repeat;mask:url('/static/brand/tickermover-mark-mask.svg') center/contain no-repeat}
    .cta{display:inline-flex;align-items:center;gap:6px;background:var(--blue);color:#fff;text-decoration:none;font-size:13px;font-weight:600;padding:8px 15px;border-radius:9px}
    .wrap{max-width:720px;margin:0 auto;padding:30px 20px 70px}
    .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--blue)}
    .byline{display:flex;align-items:center;gap:9px;margin:14px 0 4px;font-size:13.5px;color:var(--muted)}
    .byline .tm-coin{flex:none;display:block}
    .byline b{color:var(--ink);font-weight:600}
    h1.title{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:clamp(28px,5vw,42px);line-height:1.1;letter-spacing:-.015em;margin:14px 0 12px}
    .standfirst{font-size:18px;line-height:1.5;color:#334155;font-weight:400;margin:0 0 22px}
    .chips{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 26px}
    .chip{font-size:12px;font-weight:700;color:#0040c1;background:#eef4ff;border:1px solid #cfe0ff;border-radius:7px;padding:4px 10px;text-decoration:none}
    .chip:hover{background:#e0ecff}
    .article{font-size:17px;line-height:1.72;color:#1e293b}
    .article h2{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:25px;line-height:1.2;margin:38px 0 12px;letter-spacing:-.01em}
    .article h3{font-size:18px;font-weight:700;margin:26px 0 8px}
    .article p{margin:0 0 18px}
    .article ul,.article ol{margin:0 0 18px;padding-left:22px}
    .article li{margin:0 0 7px}
    .article strong{font-weight:700;color:#0f172a}
    .article em{font-style:italic}
    .pull{font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:500;font-size:24px;line-height:1.35;color:#0040c1;border-left:4px solid var(--blue);padding:6px 0 6px 20px;margin:30px 0}
    .houseview{background:linear-gradient(180deg,#eef4ff,#f8fbff);border:1px solid #cfe0ff;border-radius:16px;padding:20px 22px;margin:34px 0 10px}
    .houseview .h{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#0040c1;margin-bottom:7px}
    .houseview .t{font-size:16.5px;line-height:1.6;color:#1e293b}
    .sources{margin-top:34px;padding-top:18px;border-top:1px solid rgba(15,23,42,.1)}
    .sources .h{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#94a3b8;margin-bottom:8px}
    .sources a{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;text-decoration:none}
    .sources a:hover{color:var(--blue)}
    .disc{font-size:12.5px;color:#94a3b8;line-height:1.55;margin-top:30px;border-top:1px solid rgba(15,23,42,.08);padding-top:16px}
    .loading,.empty{text-align:center;color:#64748b;padding:80px 20px;font-size:15px}
    @media(max-width:560px){ .wrap{padding:22px 17px 60px} .article{font-size:16px} }
    /* consulting-report additions: action bar, bottom-line, data tables, print */
    .actionbar{display:flex;gap:8px;margin:2px 0 20px;flex-wrap:wrap}
    .abtn{display:inline-flex;align-items:center;gap:6px;font-family:inherit;font-size:12.5px;font-weight:600;color:#0040c1;background:#fff;border:1px solid #cfe0ff;border-radius:9px;padding:7px 13px;cursor:pointer;transition:background .14s;text-decoration:none;white-space:nowrap}
    .abtn:hover{background:#eef4ff}
    .bottomline{background:linear-gradient(180deg,#eef4ff,#f8fbff);border:1px solid #cfe0ff;border-radius:16px;padding:18px 20px;margin:0 0 22px}
    .bottomline .h{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#0040c1;margin-bottom:7px}
    .bottomline .t{font-size:17px;line-height:1.6;color:#1e293b;font-weight:500}
    .tablewrap{overflow-x:auto;margin:0 0 22px}
    .article table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.45}
    .article th,.article td{text-align:left;padding:9px 12px;border-bottom:1px solid #e2e8f0;vertical-align:top}
    .article thead th{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#475569;background:#f1f5f9;border-bottom:2px solid #cbd5e1}
    .article tbody tr:last-child td{border-bottom:none}
    /* data charts — pure-CSS horizontal bars built from ground-truth numbers */
    .charts{margin:26px 0 6px}
    .chart{background:#fff;border:1px solid #e6edf7;border-radius:14px;padding:16px 18px 14px;margin:0 0 16px}
    .chart .ch-h{font-size:14px;font-weight:800;color:#0f172a;letter-spacing:-.01em;margin:0 0 12px;display:flex;align-items:baseline;gap:8px}
    .chart .ch-unit{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#94a3b8}
    .ch-row{display:grid;grid-template-columns:88px 1fr auto;align-items:center;gap:10px;margin:0 0 8px}
    .ch-row:last-of-type{margin-bottom:0}
    .ch-lab{font-size:12.5px;font-weight:700;color:#334155;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ch-track{position:relative;height:15px;background:#eef2f8;border-radius:8px;overflow:hidden}
    .ch-fill{position:absolute;inset:0 auto 0 0;border-radius:8px;background:linear-gradient(90deg,#5DB3F1,#2970FF);min-width:3px}
    .ch-fill.neg{background:linear-gradient(90deg,#fca5a5,#ef4444)}
    .ch-fill.hi{background:linear-gradient(90deg,#2970FF,#0040c1);box-shadow:0 0 0 1.5px rgba(41,112,255,.35)}
    .ch-val{font-size:12.5px;font-weight:800;color:#0f172a;font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
    .ch-note{font-size:12.5px;color:#64748b;margin:11px 0 0;line-height:1.5}
    @media(max-width:560px){ .ch-row{grid-template-columns:64px 1fr auto;gap:8px} .ch-lab{font-size:11.5px} }
    /* donut chart — share of a whole */
    .dn-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
    .dn-svg{flex:none}
    .dn-leg{display:flex;flex-direction:column;gap:8px;min-width:150px;flex:1}
    .dn-li{display:flex;align-items:center;gap:9px;font-size:13px;color:#334155}
    .dn-dot{width:11px;height:11px;border-radius:3px;flex:none}
    .dn-li b{margin-left:auto;font-weight:800;color:#0f172a;font-variant-numeric:tabular-nums}
    /* Blinkit-style hero stat tiles */
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:0 0 24px}
    .stat{background:#fff;border:1px solid #e6edf7;border-radius:14px;padding:15px 16px;position:relative;overflow:hidden}
    .stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sc,#2970ff)}
    .stat-v{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:30px;line-height:1;letter-spacing:-.02em;color:#0f172a;display:flex;align-items:center;gap:6px}
    .stat-v .ar{font-size:16px;font-weight:900}
    .stat-v .up{color:#16a34a}.stat-v .down{color:#dc2626}.stat-v .flat{color:#94a3b8}
    .stat-l{font-size:12.5px;font-weight:700;color:#334155;margin-top:7px}
    .stat-s{font-size:11.5px;color:#94a3b8;margin-top:2px;line-height:1.35}
    /* scenario cards — Bear / Base / Bull */
    .scen-h{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:22px;letter-spacing:-.01em;margin:36px 0 14px}
    .scen{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:0 0 8px}
    .scenc{background:#fff;border:1px solid #e6edf7;border-radius:14px;padding:0 17px 16px;border-top:4px solid var(--sccol,#94a3b8);overflow:hidden}
    .scen-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:15px 0 9px}
    .scen-case{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--sccol,#475569)}
    .scen-prob{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:23px;line-height:1;color:#0f172a}
    .scen-thesis{font-size:14px;line-height:1.5;color:#1e293b;font-weight:500;margin:0 0 10px}
    .scen-trig{font-size:12px;color:#64748b;line-height:1.45;border-top:1px dashed #e2e8f0;padding-top:9px}
    .scen-trig b{color:#475569;font-weight:700}
    /* editorial section dividers + drop cap */
    .article h2::before{content:"";display:block;width:34px;height:3px;background:var(--blue);border-radius:2px;margin:0 0 13px}
    /* drop cap only on the feature's opening page, not every paged section */
    .article.lead>p:first-of-type::first-letter{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:3.3em;line-height:.82;float:left;margin:6px 10px 0 0;color:var(--blue)}
    @media print{ .stat,.scenc,.chart{break-inside:avoid} .stat::before,.stat-v .up,.stat-v .down,.dn-dot{-webkit-print-color-adjust:exact;print-color-adjust:exact} }
    /* report-grade PDF: sensible page margins so "⬇ PDF" (window.print) reads
       as a document, not a screenshot of the page. */
    @page{ margin:15mm 13mm 16mm; }
    @media print{
      .top,.actionbar,.cta{display:none!important}
      html,body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
      body{background:#fff}
      .wrap{max-width:100%;padding:0 8px}
      .article{font-size:12.5px;line-height:1.55}
      .article h2{font-size:17px;margin:20px 0 8px}
      a{color:#0f172a;text-decoration:none}
      .bottomline{break-inside:avoid}
      .article table{font-size:11px}
      .chart{break-inside:avoid;border-color:#cbd5e1}
      .ch-fill{-webkit-print-color-adjust:exact;print-color-adjust:exact}
      .covers,.news-h,.backlink{display:none!important}
    }
    /* ── paged book reader ─────────────────────────────────────────────
       Native scroll-snap: swipe, keyboard and a11y come free, every page
       stays in the DOM (so Google still indexes the whole issue), and there
       is no carousel library to ship. */
    body.book-mode .wrap{max-width:1180px}
    .book{display:flex;gap:22px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;
      padding:4px 2px 14px;margin:0 0 6px;scrollbar-width:none}
    .book::-webkit-scrollbar{display:none}
    .page{flex:0 0 100%;scroll-snap-align:start;background:#fff;border:1px solid #e6edf7;border-radius:16px;
      padding:30px 32px;min-height:70vh;overflow-y:auto;box-shadow:0 8px 26px -20px rgba(9,20,60,.5)}
    @media(min-width:900px){ .page{flex:0 0 calc(50% - 11px)} }   /* two-page spread */
    .page>h2:first-child,.page>.pg-h:first-child{margin-top:0}
    .pg-h{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:24px;letter-spacing:-.012em;margin:0 0 16px}
    .pg-num{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#94a3b8;margin-bottom:14px}
    /* page 1 — the cover, full bleed inside the page */
    .page.cover-pg{position:relative;padding:0;overflow:hidden;color:#fff;border:none;display:flex}
    .cover-pg .cp-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
    .cover-pg .cp-scrim{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(4,10,30,.45) 0%,rgba(4,10,30,.15) 40%,rgba(4,10,30,.88) 100%)}
    /* magazine-cover scrim (only added when there's a photo) — darkens a busy photo
       behind the masthead/cover-lines/headline so the type always reads cleanly */
    .cover-pg .cov-scrim{position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(6,11,28,.62) 0%,rgba(6,11,28,.30) 30%,rgba(6,11,28,.36) 56%,rgba(6,11,28,.90) 100%)}
    .cover-pg .cp-in{position:relative;z-index:2;display:flex;flex-direction:column;padding:30px;width:100%}
    .cover-pg .cp-title{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:clamp(26px,3.4vw,38px);line-height:1.06;letter-spacing:-.015em;margin:auto 0 12px;text-shadow:0 2px 18px rgba(0,0,0,.5)}
    .cover-pg .cp-stand{font-size:15.5px;line-height:1.5;opacity:.94;margin:0 0 16px;max-width:52ch}
    .cover-pg .cp-meta{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
    /* full-page magazine cover (bookCover) — scale the shared cover parts up */
    .cover-pg .cov-in.bookcov{padding:clamp(22px,3.2vw,40px)}
    .cover-pg .cov-mast{font-size:clamp(30px,3.8vw,44px)}
    .cover-pg .cov-mast .no{font-size:11px}
    .cover-pg .cov-strip{font-size:9px}
    .cover-pg .cov-lines{max-width:62%;gap:14px;margin-top:clamp(16px,2.6vw,30px)}
    .cover-pg .cov-kick{font-size:9px}
    .cover-pg .cov-line{font-size:clamp(12.5px,1.35vw,16px);-webkit-line-clamp:2}
    .cover-pg .cov-subj{font-size:11px;padding:4px 10px;margin-bottom:12px}
    .cover-pg .cov-title{font-size:clamp(28px,3.9vw,46px);-webkit-line-clamp:4;letter-spacing:-.018em}
    .cover-pg .bookcov-stand{font-size:clamp(14px,1.45vw,17px);line-height:1.5;opacity:.93;margin:14px 0 0;max-width:46ch;text-shadow:0 1px 8px rgba(0,0,0,.55)}
    .cover-pg .cov-splash{top:auto;bottom:118px;right:clamp(18px,3vw,34px);width:clamp(84px,9vw,104px);height:clamp(84px,9vw,104px)}
    .cover-pg .sp-tix{font-size:clamp(17px,1.9vw,21px)} .cover-pg .sp-verd{font-size:9px} .cover-pg .sp-sc{font-size:10px}
    .cover-pg .cov-date{font-size:12.5px}
    .cover-pg .cov-credit{display:none}
    /* nav */
    .bk-bar{display:flex;align-items:center;gap:12px;margin:0 0 26px}
    .bk-btn{width:38px;height:38px;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:17px;
      color:#0040c1;background:#fff;border:1px solid #cfe0ff;border-radius:10px;cursor:pointer;transition:background .14s}
    .bk-btn:hover:not(:disabled){background:#eef4ff}
    .bk-btn:disabled{opacity:.35;cursor:default}
    .bk-btn:focus-visible,.abtn:focus-visible,.cover:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
    .bk-ind{font-size:12.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
    .bk-dots{display:flex;gap:5px;margin-left:auto}
    .bk-dot{width:7px;height:7px;border-radius:50%;background:#cbd5e1;border:none;padding:0;cursor:pointer}
    .bk-dot.on{background:var(--blue)}
    .bk-toggle{margin-left:8px}
    /* ── "The Week" updates spread ── */
    .wk{display:flex;flex-direction:column;gap:11px}
    .wk-item{border-left:3px solid var(--wkc,#2970ff);padding:2px 0 2px 12px}
    .wk-top{display:flex;align-items:center;gap:8px;margin-bottom:3px;flex-wrap:wrap}
    .wk-kind{font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--wkc,#2970ff)}
    .wk-tix{font-size:11.5px;font-weight:800;color:#0f172a}
    .wk-metric{margin-left:auto;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;color:#0f172a}
    .wk-head{font-size:14.5px;font-weight:700;line-height:1.32;color:#0f172a}
    .wk-detail{font-size:13px;line-height:1.5;color:#64748b;margin-top:3px}
    @media (prefers-reduced-motion: reduce){ .book{scroll-behavior:auto} }
    /* continuous-scroll fallback — better for long reads, print and screen readers */
    body.scroll-view .book{display:block;overflow:visible}
    body.scroll-view .page{flex:none;min-height:0;overflow:visible;margin:0 0 18px}
    body.scroll-view .bk-btn,body.scroll-view .bk-ind,body.scroll-view .bk-dots{display:none}
    body.scroll-view .cover-pg{min-height:60vh}
    @media print{
      .book{display:block;overflow:visible}
      .page{flex:none;min-height:0;overflow:visible;break-inside:avoid;box-shadow:none;border:none;padding:0 0 14px}
      .bk-bar,.bk-dots{display:none!important}
      .cover-pg .cp-scrim{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    }
    /* newsstand gallery — magazine covers */
    body.gallery .wrap{max-width:1040px}
    .news-h{margin:6px 0 26px}
    .news-title{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:clamp(30px,5.4vw,46px);line-height:1.05;letter-spacing:-.015em;margin:8px 0 8px}
    .news-sub{font-size:16px;color:var(--muted);max-width:60ch;margin:0}
    .covers{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:26px}
    .cover{position:relative;display:block;aspect-ratio:3/4.05;border-radius:7px;overflow:hidden;color:#fff;text-decoration:none;box-shadow:0 14px 34px -16px rgba(9,20,60,.6);transition:transform .18s,box-shadow .18s;isolation:isolate}
    .cover:hover{transform:translateY(-4px);box-shadow:0 24px 50px -18px rgba(9,20,60,.72)}
    .cov-art{position:absolute;inset:0;width:100%;height:100%;z-index:0}
    /* photographic cover: image + a palette tint so the series stays coherent */
    .cov-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;display:block}
    .cov-tint{position:absolute;inset:0;z-index:0;mix-blend-mode:multiply;opacity:.55}
    .cov-credit{position:absolute;z-index:2;left:15px;bottom:74px;transform-origin:left bottom;transform:rotate(-90deg);
      font-size:7.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.55;white-space:nowrap;pointer-events:none}
    /* article hero photo */
    .hero-img{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;margin:0 0 9px;background:#eef2f8}
    .hero-img img{width:100%;height:100%;object-fit:cover;display:block}
    .hero-credit{font-size:11.5px;color:#94a3b8;margin:0 0 20px}
    .hero-credit a{color:#94a3b8;text-decoration:underline}
    .cover::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.54) 0%,rgba(0,0,0,.12) 26%,rgba(0,0,0,.22) 56%,rgba(0,0,0,.82) 100%)}
    .cover.featured{box-shadow:0 18px 44px -16px rgba(9,20,60,.62),0 0 0 2px rgba(255,255,255,.72)}
    .cov-in{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;padding:15px 15px 13px}
    /* masthead */
    .cov-mast{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:30px;line-height:.9;letter-spacing:-.022em;text-shadow:0 2px 12px rgba(0,0,0,.4);display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
    .cov-mast .no{font-family:'Instrument Sans',sans-serif;font-size:9.5px;font-weight:800;letter-spacing:.09em;opacity:.92;white-space:nowrap;text-shadow:0 1px 5px rgba(0,0,0,.5)}
    .cov-rule{height:2px;background:rgba(255,255,255,.9);margin:7px 0 5px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
    .cov-strip{font-size:8px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;opacity:.92;text-shadow:0 1px 4px rgba(0,0,0,.5)}
    /* cover-line callouts */
    .cov-lines{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:11px;max-width:72%}
    .cov-lines li{position:relative;padding-left:9px}
    .cov-lines li::before{content:"";position:absolute;left:0;top:1px;bottom:1px;width:3px;border-radius:2px;background:var(--kick,#ffd166)}
    .cov-kick{display:block;font-size:8px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--kick,#ffd166);text-shadow:0 1px 3px rgba(0,0,0,.6)}
    .cov-line{display:-webkit-box;font-size:12px;font-weight:700;line-height:1.18;margin-top:2px;text-shadow:0 1px 7px rgba(0,0,0,.6);-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    /* feature headline */
    .cov-feat{margin-top:auto}
    .cov-subj{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.34);border-radius:4px;padding:3px 8px;margin-bottom:9px}
    .cov-title{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:23px;line-height:1.06;letter-spacing:-.012em;text-shadow:0 2px 16px rgba(0,0,0,.55);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    .cover.featured .cov-title{font-size:26px}
    /* foot — barcode + site */
    .cov-foot{margin-top:11px;padding-top:9px;border-top:1px solid rgba(255,255,255,.36);display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
    .cov-site{display:flex;flex-direction:column;gap:2px;min-width:0}
    .cov-date{font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cov-url{font-size:8.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;opacity:.82}
    .cov-code{flex:none}
    /* splash flash badge */
    .cov-splash{position:absolute;z-index:3;top:70px;right:13px;width:74px;height:74px;transform:rotate(7deg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#0b1220;filter:drop-shadow(0 3px 9px rgba(0,0,0,.4))}
    .cov-splash svg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
    .cov-splash>span{position:relative;z-index:1}
    .sp-verd{font-size:7.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-bottom:1px}
    .sp-tix{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:15px;line-height:1}
    .sp-sc{font-size:9px;font-weight:800;margin-top:1px}
    .backlink{display:inline-block;font-size:13px;font-weight:600;color:var(--blue);text-decoration:none;margin:0 0 16px}
    @media(max-width:560px){
      .covers{grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:15px}
      .cov-in{padding:11px 11px 10px}
      .cov-mast{font-size:21px}.cov-mast .no{font-size:8px}
      .cov-lines{gap:8px;margin-top:11px;max-width:74%}.cov-line{font-size:10.5px}
      .cov-title{font-size:16px}.cover.featured .cov-title{font-size:18px}
      .cov-splash{width:56px;height:56px;top:52px;right:9px}.sp-tix{font-size:12px}.sp-sc{font-size:8px}.sp-verd{font-size:6.5px}
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="top-in">
      <a class="brand" href="/"><span class="mark"></span><span>TickerMover</span></a>
      <a class="cta" href="/app">Open the dashboard →</a>
    </div>
  </header>
  <main class="wrap"><div id="article"><div class="loading">📰 Loading the newsstand…</div></div></main>

  <script>
  (function(){
    // ── TickerMover coin: ink-T (rounded stroke) + the exact wordmark mountain-M
    //    with summit dot, white on the brand-blue circle. Reusable avatar. ──
    var TM_COIN = '<svg class="tm-coin" width="32" height="32" viewBox="0 0 104 104" role="img" aria-label="TickerMover"><defs><linearGradient id="tmCoinG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5DB3F1"/><stop offset=".5" stop-color="#2970FF"/><stop offset="1" stop-color="#0040C1"/></linearGradient></defs><circle cx="52" cy="52" r="51" fill="url(#tmCoinG)"/><line x1="20" y1="41" x2="42" y2="41" stroke="#fff" stroke-width="5.2" stroke-linecap="round"/><line x1="31" y1="41" x2="31" y2="71" stroke="#fff" stroke-width="5.2" stroke-linecap="round"/><g transform="translate(44.7,26) scale(0.46)"><polyline points="5,100 23,42 45,66 67,26 85,100" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="67" cy="8" r="7" fill="#fff"/></g></svg>';
    // ── Minimal, safe Markdown → HTML (headings, lists, bold/italic, links) ──
    function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function inline(s){
      s = esc(s);
      s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
      s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
      s = s.replace(/(^|[^*])\*([^*]+)\*(?!\*)/g,'$1<em>$2</em>');
      return s;
    }
    // Web-grounded Opus output wraps cited claims in <cite index="..">..</cite>
    // tags. Strip the tags (keep the cited text) so they don't render as raw
    // markup; attribution lives in the Sources list below.
    function stripCites(s){ return (s||'').replace(/<\/?cite[^>]*>/gi,''); }
    function md(text){
      const lines = stripCites(text||'').replace(/\r/g,'').split('\n');
      let html='', para=[], list=null;
      const flushP=()=>{ if(para.length){ html+='<p>'+inline(para.join(' '))+'</p>'; para=[]; } };
      const flushL=()=>{ if(list){ html+='</'+list+'>'; list=null; } };
      const isSep=(s)=>/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)+\|?\s*$/.test(s||'');
      const cells=(s)=>{ s=s.trim().replace(/^\|/,'').replace(/\|$/,''); return s.split('|').map(c=>c.trim()); };
      for(let i=0;i<lines.length;i++){
        const raw=lines[i], line=raw.trimEnd();
        // GFM pipe table: a header row with pipes, immediately followed by a --- separator
        if(/\|/.test(line) && isSep(lines[i+1])){
          flushP(); flushL();
          const head=cells(line); i+=2; let rows='';
          while(i<lines.length && lines[i].indexOf('|')>=0 && lines[i].trim()!==''){
            rows+='<tr>'+cells(lines[i]).map(x=>'<td>'+inline(x)+'</td>').join('')+'</tr>'; i++;
          }
          i--;
          html+='<div class="tablewrap"><table><thead><tr>'+head.map(x=>'<th>'+inline(x)+'</th>').join('')+'</tr></thead><tbody>'+rows+'</tbody></table></div>';
          continue;
        }
        if(/^###\s+/.test(line)){ flushP(); flushL(); html+='<h3>'+inline(line.replace(/^###\s+/,''))+'</h3>'; continue; }
        if(/^##\s+/.test(line)){ flushP(); flushL(); html+='<h2>'+inline(line.replace(/^##\s+/,''))+'</h2>'; continue; }
        if(/^#\s+/.test(line)){ flushP(); flushL(); html+='<h2>'+inline(line.replace(/^#\s+/,''))+'</h2>'; continue; }
        if(/^[-*]\s+/.test(line)){ flushP(); if(list!=='ul'){flushL();html+='<ul>';list='ul';} html+='<li>'+inline(line.replace(/^[-*]\s+/,''))+'</li>'; continue; }
        if(/^\d+\.\s+/.test(line)){ flushP(); if(list!=='ol'){flushL();html+='<ol>';list='ol';} html+='<li>'+inline(line.replace(/^\d+\.\s+/,''))+'</li>'; continue; }
        if(line===''){ flushP(); flushL(); continue; }
        if(list) flushL();
        para.push(line);
      }
      flushP(); flushL();
      return html;
    }

    // A donut for share-of-a-whole data. Categorical hues in FIXED order (never
    // cycled beyond the ramp); legend labels carry identity so it is never
    // colour-alone. Center shows the largest slice.
    var DN_PAL=['#2970ff','#12b3a6','#f59e0b','#9b5de5','#64748b','#0ea5e9'];
    function donutHtml(ch){
      var segs=(ch.bars||[]).filter(function(b){return b&&isFinite(+b.value)&&+b.value>0;});
      if(!segs.length) return '';
      var total=0,i; for(i=0;i<segs.length;i++) total+=+segs[i].value; if(total<=0) return '';
      var cx=70,cy=70,r=54,C=2*Math.PI*r, cum=0, ring='', leg='', big={v:-1,pct:0,label:''};
      for(i=0;i<segs.length;i++){
        var v=+segs[i].value, frac=v/total, col=DN_PAL[i%DN_PAL.length], pct=Math.round(frac*100);
        var dash=Math.max(0,frac*C-2);
        ring+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="26" '+
              'stroke-dasharray="'+dash.toFixed(2)+' '+(C-dash).toFixed(2)+'" stroke-dashoffset="'+(-cum*C).toFixed(2)+'"/>';
        leg+='<div class="dn-li"><span class="dn-dot" style="background:'+col+'"></span>'+esc(String(segs[i].label||''))+'<b>'+pct+'%</b></div>';
        if(v>big.v){ big={v:v,pct:pct,label:String(segs[i].label||'')}; }
        cum+=frac;
      }
      var svg='<svg class="dn-svg" width="140" height="140" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg" role="img">'+
        '<g transform="rotate(-90 70 70)">'+ring+'</g>'+
        '<text x="70" y="67" text-anchor="middle" font-family="Fraunces,Georgia,serif" font-weight="600" font-size="27" fill="#0f172a">'+big.pct+'%</text>'+
        '<text x="70" y="85" text-anchor="middle" font-size="9.5" font-weight="700" letter-spacing=".04em" fill="#64748b">'+esc(big.label.slice(0,11).toUpperCase())+'</text></svg>';
      return '<div class="chart"><div class="ch-h">'+esc(ch.title||'Share of the whole')+'</div>'+
        '<div class="dn-wrap">'+svg+'<div class="dn-leg">'+leg+'</div></div>'+
        (ch.note?'<p class="ch-note">'+esc(stripCites(ch.note))+'</p>':'')+'</div>';
    }
    // Render the `charts` array: horizontal bars (magnitude / signed moves; scaled
    // to max ABS value so negatives read red) or a donut (type:"donut").
    function chartsHtml(charts){
      if(!Array.isArray(charts) || !charts.length) return '';
      var out='';
      for(var c=0;c<charts.length;c++){
        var ch=charts[c]||{};
        if((ch.type||'')==='donut'){ out+=donutHtml(ch); continue; }
        var bars=Array.isArray(ch.bars)?ch.bars.filter(function(b){return b&&isFinite(+b.value);}):[];
        if(!bars.length) continue;
        var unit=(ch.unit||'').trim(), max=0;
        for(var j=0;j<bars.length;j++){ var a=Math.abs(+bars[j].value); if(a>max) max=a; }
        if(max<=0) max=1;
        var rows='';
        for(var k=0;k<bars.length;k++){
          var b=bars[k], v=+b.value, w=Math.max(3,Math.round(Math.abs(v)/max*100));
          var cls='ch-fill'+(b.hi?' hi':'')+(v<0?' neg':'');
          var disp=(unit==='%')?( (v>0?'+':'')+v+'%' ):(unit==='$')?('$'+v):String(v);
          rows+='<div class="ch-row"><span class="ch-lab">'+esc(String(b.label||''))+'</span>'+
                '<span class="ch-track"><span class="'+cls+'" style="width:'+w+'%"></span></span>'+
                '<span class="ch-val">'+esc(disp)+'</span></div>';
        }
        out+='<div class="chart"><div class="ch-h">'+esc(ch.title||'By the numbers')+
             (unit?'<span class="ch-unit">'+esc(unit==='%'?'% change':unit==='$'?'USD':unit)+'</span>':'')+'</div>'+
             rows+(ch.note?'<p class="ch-note">'+esc(stripCites(ch.note))+'</p>':'')+'</div>';
      }
      return out?'<div class="charts">'+out+'</div>':'';
    }
    // Blinkit-style hero numbers under the standfirst — the headline figures.
    function statTiles(tiles){
      if(!Array.isArray(tiles)||!tiles.length) return '';
      var AR={up:'▲',down:'▼',flat:'—'};
      var out=tiles.slice(0,4).map(function(t){
        var dir=String(t.dir||'flat').toLowerCase(); if(!AR[dir]) dir='flat';
        return '<div class="stat"><div class="stat-v">'+esc(String(t.value||''))+
          '<span class="ar '+dir+'">'+AR[dir]+'</span></div>'+
          '<div class="stat-l">'+esc(String(t.label||''))+'</div>'+
          (t.sub?'<div class="stat-s">'+esc(stripCites(t.sub))+'</div>':'')+'</div>';
      }).join('');
      return '<div class="stats">'+out+'</div>';
    }
    // Bear / Base / Bull scenario cards — status colours WITH a labelled case, never colour-alone.
    function scenarioCards(sc){
      if(!Array.isArray(sc)||!sc.length) return '';
      var COL={bear:'#dc2626',base:'#64748b',bull:'#16a34a'}, ORD={bear:0,base:1,bull:2};
      var arr=sc.slice(0,3).slice().sort(function(a,b){
        return (ORD[String(a.case||'').toLowerCase()]==null?9:ORD[String(a.case||'').toLowerCase()])
             - (ORD[String(b.case||'').toLowerCase()]==null?9:ORD[String(b.case||'').toLowerCase()]); });
      var cards=arr.map(function(s){
        var col=COL[String(s.case||'').toLowerCase()]||'#94a3b8';
        return '<div class="scenc" style="--sccol:'+col+'">'+
          '<div class="scen-top"><span class="scen-case">'+esc(String(s.case||''))+'</span>'+
          (s.prob?'<span class="scen-prob">'+esc(String(s.prob))+'</span>':'')+'</div>'+
          (s.thesis?'<p class="scen-thesis">'+esc(stripCites(s.thesis))+'</p>':'')+
          (s.trigger?'<div class="scen-trig"><b>Trigger:</b> '+esc(stripCites(s.trigger))+'</div>':'')+'</div>';
      }).join('');
      return '<div class="scen-h">Bear · Base · Bull — our scenario map</div><div class="scen">'+cards+'</div>';
    }

    // Hero photo for the issue, with the linked photographer credit the image
    // providers' terms require.
    function heroImage(d){
      var img=d.cover_image;
      if(!img||!img.url) return '';
      var credit = img.credit_name
        ? '<p class="hero-credit">Photo: <a href="'+esc(img.credit_url||'#')+'" target="_blank" rel="noopener nofollow">'+
          esc(img.credit_name)+'</a>'+(img.source?' · '+esc(img.source):'')+'</p>'
        : '';
      return '<div class="hero-img"><img src="'+esc(img.url)+'" alt="'+esc(img.alt||d.subject||'')+'" loading="lazy"></div>'+credit;
    }
    function shareBar(){
      return '<div class="actionbar">'+
        (navigator.share?'<button id="btnNative" class="abtn" type="button">↗ Share</button>':'')+
        '<button id="btnShare" class="abtn" type="button">🔗 Copy link</button>'+
        '<a id="btnX"  class="abtn" target="_blank" rel="noopener">Post on X</a>'+
        '<a id="btnLi" class="abtn" target="_blank" rel="noopener">LinkedIn</a>'+
        '<a id="btnWa" class="abtn" target="_blank" rel="noopener">WhatsApp</a>'+
        '<button id="btnPdf" class="abtn" type="button">⬇ PDF</button></div>';
    }
    function wireShare(title){
      var url=location.href, u=encodeURIComponent(url), t=encodeURIComponent(title||'Market Movers — TickerMover');
      var set=function(id,href){ var el=document.getElementById(id); if(el) el.href=href; };
      set('btnX','https://twitter.com/intent/tweet?text='+t+'&url='+u);
      set('btnLi','https://www.linkedin.com/sharing/share-offsite/?url='+u);
      set('btnWa','https://api.whatsapp.com/send?text='+t+'%20'+u);
      var bn=document.getElementById('btnNative');
      if(bn) bn.onclick=function(){ navigator.share({title:title||document.title,url:url}).catch(function(){}); };
      var bs=document.getElementById('btnShare');
      if(bs) bs.onclick=function(){
        var done=function(){ bs.textContent='✓ Link copied'; setTimeout(function(){bs.textContent='🔗 Copy link';},1800); };
        if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(done).catch(function(){ prompt('Copy this link:', url); }); }
        else { prompt('Copy this link:', url); }
      };
      var bp=document.getElementById('btnPdf');
      if(bp) bp.onclick=function(){ window.print(); };
    }

    // "The Week" spread: `engine` = our own book moving (proprietary),
    // `market` = what happened out there. Rendered as two facing pages.
    function weekUpdatesHtml(wu, which){
      if(!wu) return '';
      var items=(which==='engine'? wu.engine : wu.market)||[];
      if(!Array.isArray(items)||!items.length) return '';
      var KC={entry:'#16a34a',exit:'#dc2626',book:'#2970ff'};
      var out=items.slice(0,6).map(function(it){
        var kind=String(it.kind||'book').toLowerCase();
        var col = which==='engine' ? (KC[kind]||'#2970ff') : '#0ea5e9';
        var label = which==='engine'
          ? (kind==='entry'?'New entry':kind==='exit'?'Exit':'Book')
          : (it.tag||'Market');
        return '<div class="wk-item" style="--wkc:'+col+'">'+
          '<div class="wk-top"><span class="wk-kind">'+esc(label)+'</span>'+
            (it.ticker?'<span class="wk-tix">'+esc(it.ticker)+'</span>':'')+
            (it.metric?'<span class="wk-metric">'+esc(it.metric)+'</span>':'')+'</div>'+
          '<div class="wk-head">'+esc(stripCites(it.headline||''))+'</div>'+
          (it.detail?'<div class="wk-detail">'+esc(stripCites(it.detail))+'</div>':'')+
        '</div>';
      }).join('');
      return '<div class="wk">'+out+'</div>';
    }
    // Paginate the feature on its ## headings — one section per page.
    function splitSections(t){
      return stripCites(t||'').replace(/\r/g,'').split(/\n(?=##\s)/).filter(function(p){return p.trim();});
    }
    // Page 1 IS the magazine cover — the same designed cover as the newsstand,
    // full-bleed. The vector art is ALWAYS the base layer, so the headline stays
    // legible whether or not a photo is present (fixes the blank-cover case).
    function bookCover(d){
      var seed=d.week_start||d.title||'x', g=coverGrad(seed);
      var subj=d.subject||'', glyph=(subj||d.title||'T').trim().charAt(0).toUpperCase();
      var img=d.cover_image||null, grad='linear-gradient(155deg,'+g[0]+' 0%,'+g[1]+' 100%)';
      var no=issueNo(d.week_start);
      var art=coverArt(seed,glyph)+((img&&img.url)
        ? '<img class="cov-photo" src="'+esc(img.url)+'" alt="'+esc(img.alt||subj||'')+'"><div class="cov-tint" style="background:'+grad+'"></div><div class="cov-scrim"></div>' : '');
      var lines=(d.cover_lines||[]).slice(0,3).map(function(t,k){
        return '<li style="--kick:'+COV_KICK[k%3]+'"><span class="cov-kick">'+COV_KLAB[k%3]+'</span>'+
               '<span class="cov-line">'+esc(stripCites(t))+'</span></li>'; }).join('');
      return '<section class="page cover-pg" style="background:'+grad+'">'+art+splashBadge(d.cover_splash)+
        '<div class="cov-in bookcov">'+
          '<div class="cov-mast"><span>Market Movers</span><span class="no">'+(no?'No. '+no:'')+'</span></div>'+
          '<div class="cov-rule"></div>'+
          '<div class="cov-strip">TickerMover · Finance &amp; Markets Intelligence</div>'+
          (lines?'<ul class="cov-lines">'+lines+'</ul>':'')+
          '<div class="cov-feat">'+(subj?'<span class="cov-subj">'+esc(subj)+'</span>':'')+
            '<div class="cov-title">'+esc(stripCites(d.title||''))+'</div>'+
            (d.standfirst?'<p class="bookcov-stand">'+esc(stripCites(d.standfirst))+'</p>':'')+
          '</div>'+
          '<div class="cov-foot"><div class="cov-site"><span class="cov-date">'+esc(d.week_label?('Week of '+d.week_label):'')+'</span>'+
            '<span class="cov-url">tickermover.com</span></div>'+barcodeSvg(seed)+'</div>'+
        '</div></section>';
    }
    function buildPages(d){
      var pages=[];
      pages.push(bookCover(d));
      pages.push('<section class="page"><div class="pg-num">The bottom line</div>'+
        (d.house_view?'<div class="bottomline"><div class="h">⚖️ Bottom line</div><div class="t">'+esc(stripCites(d.house_view))+'</div></div>':'')+
        statTiles(d.stat_tiles)+'</section>');
      var eng=weekUpdatesHtml(d.week_updates,'engine'), mkt=weekUpdatesHtml(d.week_updates,'market');
      if(eng) pages.push('<section class="page"><div class="pg-num">The week · from our desk</div>'+
        '<div class="pg-h">What our engine did</div>'+eng+'</section>');
      if(mkt) pages.push('<section class="page"><div class="pg-num">The week · in the market</div>'+
        '<div class="pg-h">What moved</div>'+mkt+'</section>');
      var secs=splitSections(d.body_markdown);
      for(var i=0;i<secs.length;i++){
        pages.push('<section class="page"><div class="pg-num">The feature'+(secs.length>1?' · '+(i+1)+'/'+secs.length:'')+'</div>'+
          '<div class="article'+(i===0?' lead':'')+'">'+md(secs[i])+'</div></section>');
      }
      var ch=chartsHtml(d.charts);
      if(ch) pages.push('<section class="page"><div class="pg-num">By the numbers</div>'+ch+'</section>');
      var sc=scenarioCards(d.scenarios);
      if(sc) pages.push('<section class="page"><div class="pg-num">Scenarios</div>'+sc+'</section>');
      var sources=(d.sources||[]).map(function(s){
        return '<a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.title||s.url)+' ↗</a>';
      }).join('');
      pages.push('<section class="page"><div class="pg-num">Endnotes</div>'+
        (d.pull_quote?'<div class="pull">“'+esc(stripCites(d.pull_quote))+'”</div>':'')+
        (sources?'<div class="sources"><div class="h">Sources</div>'+sources+'</div>':'')+
        '<div class="disc">TickerMover\'s editorial opinion, framed on our own Bullish/Cautious view basis — for information, education and market awareness only, not investment advice, not a personal recommendation, and not FCA-authorised. Figures from our models and cited sources. Capital at risk; past performance is not a guide to future results. Do your own research.</div>'+
      '</section>');
      return pages;
    }
    function wireBook(){
      var bk=document.getElementById('book'); if(!bk) return;
      var pages=[].slice.call(bk.querySelectorAll('.page'));
      var prev=document.getElementById('bkPrev'), next=document.getElementById('bkNext'),
          ind=document.getElementById('bkInd'), dots=document.getElementById('bkDots'),
          tog=document.getElementById('bkToggle');
      var base=pages.length?pages[0].offsetLeft:0;
      function perView(){ return bk.clientWidth>=900?2:1; }
      function curIdx(){
        var best=0,bd=Infinity;
        pages.forEach(function(p,i){ var dd=Math.abs((p.offsetLeft-base)-bk.scrollLeft); if(dd<bd){bd=dd;best=i;} });
        return best;
      }
      var RM = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)');
      function go(i){
        i=Math.max(0,Math.min(pages.length-1,i));
        bk.scrollTo({left:pages[i].offsetLeft-base, behavior:(RM&&RM.matches)?'auto':'smooth'});
      }
      dots.innerHTML=pages.map(function(_,i){return '<button class="bk-dot" type="button" aria-label="Go to page '+(i+1)+'"></button>';}).join('');
      [].forEach.call(dots.children,function(b,i){ b.onclick=function(){ go(i); }; });
      function update(){
        var i=curIdx();
        ind.textContent=(i+1)+' / '+pages.length;
        prev.disabled = bk.scrollLeft<=2;
        next.disabled = bk.scrollLeft>=bk.scrollWidth-bk.clientWidth-2;
        [].forEach.call(dots.children,function(b,k){ b.classList.toggle('on',k===i); });
      }
      prev.onclick=function(){ go(curIdx()-perView()); };
      next.onclick=function(){ go(curIdx()+perView()); };
      bk.addEventListener('scroll',function(){ clearTimeout(bk._t); bk._t=setTimeout(update,60); });
      bk.addEventListener('keydown',function(e){
        if(e.key==='ArrowRight'){ e.preventDefault(); go(curIdx()+perView()); }
        else if(e.key==='ArrowLeft'){ e.preventDefault(); go(curIdx()-perView()); }
      });
      window.addEventListener('resize',function(){ base=pages.length?pages[0].offsetLeft:0; update(); });
      tog.onclick=function(){
        var lin=document.body.classList.toggle('scroll-view');
        tog.textContent = lin ? '📖 Book view' : '📜 Scroll view';
        if(!lin) update();
      };
      update();
    }

    function render(d){
      var root=document.getElementById('article');
      if(!d || d.available===false){
        root.innerHTML='<div class="empty">'+( (d&&d.reason) || 'The weekly editorial is being prepared. Check back shortly.')+'</div>';
        return;
      }
      document.body.classList.add('scroll-view');
      var tickers=(d.tickers||[]).map(function(t){
        return '<a class="chip" href="/stocks/'+encodeURIComponent(t)+'">'+esc(t)+'</a>';
      }).join('');
      var when=[d.week_label?('Week of '+esc(d.week_label)):'', d.published_at?('· '+esc(d.published_at)):''].filter(Boolean).join(' ');
      var _rwk=parseWeek();
      // Canonicalise ?week= (and bare paths) to the pretty permalink so shares/
      // copy-link use the SEO URL. History-only; no network, no reload.
      try{
        if(d.week_start){
          var pretty='/weekly/'+d.week_start+'/'+(d.slug||slugify(d.title||d.subject||'issue'));
          if(location.pathname+location.search!==pretty) history.replaceState(null,'',pretty);
        }
      }catch(e){}
      root.innerHTML =
        (_rwk?'<a class="backlink" href="/weekly">← All issues</a>':'')+
        '<div class="eyebrow">From the desk · Market Movers</div>'+
        '<div class="byline">'+TM_COIN+'<b>'+esc(d.byline||'TickerMover Desk')+'</b> · '+when+'</div>'+
        shareBar()+
        (tickers?'<div class="chips">'+tickers+'</div>':'')+
        '<div class="book" id="book">'+
          buildPages(d).join('')+
        '</div>';
      if(d.title) document.title=d.title+' — TickerMover';
      wireShare(d.title||'');
    }

    // SEO-friendly issue URLs: /weekly/<YYYY-MM-DD>/<slug>. The date is the key;
    // the slug is human/search-readable. Old ?week= links still resolve.
    var _STOP={the:1,a:1,an:1,is:1,are:1,of:1,to:1,in:1,on:1,for:1,and:1,or:1,its:1,at:1,by:1,'as':1,'with':1,that:1,'this':1,has:1,was:1,market:1,s:1};
    function slugify(t){
      var words=String(t||'').toLowerCase().replace(/[^a-z0-9\s-]/g,' ').split(/[\s-]+/).filter(function(w){return w&&!_STOP[w];});
      return (words.slice(0,7).join('-')||'issue').slice(0,80).replace(/^-+|-+$/g,'');
    }
    function weeklyHref(e){
      var wk=(e&&e.week_start)||''; if(!wk) return '/weekly';
      return '/weekly/'+encodeURIComponent(wk)+'/'+(e.slug||slugify(e.title||e.subject||'issue'));
    }
    function parseWeek(){
      var m=location.pathname.match(/^\/weekly\/(\d{4}-\d{2}-\d{2})/);
      if(m) return m[1];
      return (new URLSearchParams(location.search).get('week')||'').trim();
    }
    // Deterministic magazine-cover gradient per issue (no images, no AI cost).
    function coverGrad(seed){
      var pals=[['#0b3d91','#2970ff'],['#0b5d5a','#12b3a6'],['#4c2a86','#9b5de5'],['#1f3a24','#3f9d55'],['#3a2f22','#a8743a'],['#1e293b','#51607a'],['#5c1a2b','#b23a52'],['#123a52','#2b8cbe']];
      var h=0, s=String(seed||''); for(var i=0;i<s.length;i++){ h=((h*31)+s.charCodeAt(i))>>>0; }
      return pals[h%pals.length];
    }
    // Seeded PRNG so each issue's cover art is stable but distinct.
    function seededRand(seed){
      var h=1779033703 ^ seed.length;
      for(var i=0;i<seed.length;i++){ h=Math.imul(h ^ seed.charCodeAt(i),3432918353); h=(h<<13)|(h>>>19); }
      return function(){ h=Math.imul(h ^ (h>>>16),2246822507); h=Math.imul(h ^ (h>>>13),3266489909); h^=h>>>16; return (h>>>0)/4294967296; };
    }
    // Market-themed cover art: faint grid + volume bars + a rising price path
    // with area fill and node dots — vector, colored by the cover gradient.
    function coverArt(seed,glyph){
      var rnd=seededRand(String(seed||'x')), W=300,H=405,n=7,step=W/(n-1),pts=[],y=H*0.66,i;
      for(i=0;i<n;i++){ y+=(rnd()-0.5)*H*0.13; y-=(i/(n-1))*H*0.20; y=Math.max(H*0.34,Math.min(H*0.74,y)); pts.push([Math.round(i*step),Math.round(y)]); }
      var line='M '+pts.map(function(p){return p[0]+' '+p[1];}).join(' L ');
      var area=line+' L '+W+' '+H+' L 0 '+H+' Z';
      var dots=pts.map(function(p){return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="2.6" fill="#fff" fill-opacity=".85"/>';}).join('');
      var grid=''; for(var g=1;g<7;g++){ var gy=Math.round(H*g/7); grid+='<line x1="0" y1="'+gy+'" x2="'+W+'" y2="'+gy+'" stroke="#fff" stroke-opacity=".06"/>'; }
      var bars=''; for(var b=0;b<6;b++){ var bh=24+Math.round(rnd()*70); bars+='<rect x="'+(16+b*48)+'" y="'+(H-bh-4)+'" width="18" height="'+bh+'" fill="#fff" fill-opacity=".05"/>'; }
      var mono = glyph? '<text x="'+(W-6)+'" y="'+Math.round(H*0.40)+'" text-anchor="end" font-family="Fraunces,Georgia,serif" font-weight="600" font-size="200" fill="#fff" fill-opacity=".06">'+esc(glyph)+'</text>':'';
      return '<svg class="cov-art" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">'+
        grid+mono+bars+'<path d="'+area+'" fill="#fff" fill-opacity=".07"/>'+
        '<path d="'+line+'" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>'+dots+'</svg>';
    }
    // A real-looking barcode strip for the cover foot (seeded → stable per issue).
    function barcodeSvg(seed){
      var rnd=seededRand('bc'+String(seed||'x')), W=58,H=26,x=4,r='';
      while(x<W-4){ var w=1+Math.round(rnd()*2); if(rnd()>0.34) r+='<rect x="'+x+'" y="4" width="'+w+'" height="'+(H-9)+'" fill="#0b1220"/>'; x+=w+1; }
      return '<svg class="cov-code" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="'+W+'" height="'+H+'" rx="3" fill="#fff"/>'+r+'</svg>';
    }
    // Magazine "flash" seal for the marquee ticker + its house verdict.
    function starburst(fill){
      var cx=37,cy=37,n=15,ro=36,ri=29.5,pts='';
      for(var i=0;i<n*2;i++){ var rr=(i%2?ri:ro), a=Math.PI*i/n - Math.PI/2; pts+=(cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1)+' '; }
      return '<svg viewBox="0 0 74 74" xmlns="http://www.w3.org/2000/svg"><polygon points="'+pts+'" fill="'+fill+'" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>';
    }
    function splashBadge(sp){
      if(!sp||!sp.ticker) return '';
      var v=String(sp.verdict||'Watch'), key=v.toLowerCase();
      var fill=key.indexOf('out')>=0?'#16a34a':key.indexOf('avoid')>=0?'#dc2626':'#d97706';
      var ink=(key.indexOf('avoid')>=0)?'#fff':'#0b1220';
      return '<div class="cov-splash" style="color:'+ink+'">'+starburst(fill)+
        '<span class="sp-verd">'+esc(v)+'</span><span class="sp-tix">'+esc(sp.ticker)+'</span>'+
        (sp.score!=null&&sp.score!==''?'<span class="sp-sc">Alpha '+esc(String(sp.score))+'</span>':'')+'</div>';
    }
    // Stable, increasing issue number from the ISO Monday (weeks since 29 Dec 2025).
    function issueNo(ws){
      try{ var d=new Date(String(ws)+'T00:00:00Z'); if(isNaN(d)) return null;
        var n=Math.round((d.getTime()-Date.UTC(2025,11,29))/6048e5); return n>0?n:null; }
      catch(e){ return null; }
    }
    var COV_KICK=['#ffd166','#7dd3fc','#fca5a5'], COV_KLAB=['Inside','The Data','Our Call'];
    function coverCard(e,i,featured){
      var seed=e.week_start||e.title||('i'+i);
      var g=coverGrad(seed);
      var href=weeklyHref(e);
      var subj=e.subject||'';
      var glyph=(subj||e.title||'T').trim().charAt(0).toUpperCase();
      var no=issueNo(e.week_start);
      var lines=(e.cover_lines||[]).slice(0,3).map(function(t,k){
        return '<li style="--kick:'+COV_KICK[k%3]+'"><span class="cov-kick">'+COV_KLAB[k%3]+'</span>'+
               '<span class="cov-line">'+esc(stripCites(t))+'</span></li>'; }).join('');
      // The generated vector cover is ALWAYS laid down first, so a photo that
      // 404s or is blocked reveals a designed cover rather than a bare gradient.
      // The photo (when present) paints over it, plus a palette tint.
      var img=e.cover_image||null, grad='linear-gradient(155deg,'+g[0]+' 0%,'+g[1]+' 100%)';
      var art = coverArt(seed,glyph) + ((img&&img.url)
        ? '<img class="cov-photo" src="'+esc(img.url)+'" alt="'+esc(img.alt||subj||'')+'" loading="lazy">'+
          '<div class="cov-tint" style="background:'+grad+'"></div>'
        : '');
      var credit = (img&&img.credit_name)
        ? '<span class="cov-credit">Photo · '+esc(img.credit_name)+'</span>' : '';
      return '<a class="cover'+(featured?' featured':'')+'" href="'+href+'" style="background:'+grad+'">'+
        art+credit+
        splashBadge(e.cover_splash)+
        '<div class="cov-in">'+
          '<div class="cov-mast"><span>Market Movers</span><span class="no">'+(no?'No. '+no:'')+(i===0?' · LATEST':'')+'</span></div>'+
          '<div class="cov-rule"></div>'+
          '<div class="cov-strip">TickerMover · Finance &amp; Markets Intelligence</div>'+
          (lines?'<ul class="cov-lines">'+lines+'</ul>':'')+
          '<div class="cov-feat">'+
            (subj?'<span class="cov-subj">'+esc(subj)+'</span>':'')+
            '<div class="cov-title">'+esc(stripCites(e.title||subj||'Untitled issue'))+'</div>'+
          '</div>'+
          '<div class="cov-foot"><div class="cov-site"><span class="cov-date">'+esc(e.week_label||e.week_start||'')+'</span>'+
            '<span class="cov-url">tickermover.com</span></div>'+barcodeSvg(seed)+'</div>'+
        '</div>'+
      '</a>';
    }
    function renderGallery(d){
      var root=document.getElementById('article');
      var eds=(d&&d.editions)||[];
      document.body.classList.add('gallery');
      if(!eds.length){ root.innerHTML='<div class="empty">📰 The first weekly issue is on its way. Check back soon.</div>'; return; }
      var head='<div class="news-h"><div class="eyebrow">From the desk</div>'+
        '<h1 class="news-title">Market Movers</h1>'+
        '<p class="news-sub">TickerMover\'s signed weekly stock-market analysis — one deep, data-grounded issue a week on the sectors and stocks that are moving. Pick an issue to read.</p></div>';
      var covers=eds.map(function(e,i){ return coverCard(e,i, i===0); }).join('');
      root.innerHTML=head+'<div class="covers">'+covers+'</div>';
      // If a cover photo fails (404, blocked, offline), drop it and its tint so
      // the generated vector cover underneath shows through. Wired in JS rather
      // than an inline onerror so a strict CSP can't disable it.
      [].forEach.call(root.querySelectorAll('.cov-photo'),function(im){
        im.addEventListener('error',function(){
          var t=im.nextElementSibling;
          if(t&&t.classList.contains('cov-tint')) t.remove();
          var cr=im.parentNode&&im.parentNode.querySelector('.cov-credit');
          if(cr) cr.remove();
          im.remove();
        });
      });
      document.title='Market Movers — Weekly Stock Market Analysis | TickerMover';
    }

    var _wk=parseWeek();
    if(_wk){
      fetch('/api/weekly-editorial?week='+encodeURIComponent(_wk))
        .then(function(r){return r.json();}).then(render).catch(function(){
          document.getElementById('article').innerHTML='<div class="empty">Could not load this issue. Please try again shortly.</div>';
        });
    } else {
      fetch('/api/weekly-editorials').then(function(r){return r.json();}).then(renderGallery).catch(function(){
        // fallback: if the index fails, drop back to the latest article
        fetch('/api/weekly-editorial').then(function(r){return r.json();}).then(render).catch(function(){
          document.getElementById('article').innerHTML='<div class="empty">Could not load the newsstand. Please try again shortly.</div>';
        });
      });
    }
  })();
  </script>
</body>
</html>
