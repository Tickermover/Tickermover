<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" role="img" aria-label="AlphaHunt">
  <defs>
    <linearGradient id="ah-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16a34a"/>
      <stop offset="0.55" stop-color="#84cc16"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
  </defs>
  <!-- Background optional — for dark social headers -->
  <rect width="1600" height="400" fill="#0f172a"/>
  <!-- Mark (no background fill so chart shows directly on dark canvas) -->
  <g transform="translate(40,40)">
    <polyline points="45,225 100,145 160,181 220,80 270,131"
              stroke="url(#ah-grad)" stroke-width="24" fill="none"
              stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="220" cy="80" r="26" fill="#a3e635"/>
  </g>
  <!-- Wordmark "AlphaHunt" -->
  <text x="420" y="266"
        font-family="'Inter','Helvetica Neue',Arial,sans-serif"
        font-weight="900"
        font-size="220"
        letter-spacing="-6"
        fill="#ffffff">Alpha<tspan fill="#a3e635">Hunt</tspan></text>
</svg>
